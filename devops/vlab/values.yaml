# empty, use deploy values
#
#
# Hermes off by default; staging.yaml sets hermes.enabled: true. This keeps the
# staging-only -wa ingester from ever rendering in production.
hermes:
  enabled: false

# botserver on by default (production still runs it); staging.yaml sets
# botserver.enabled: false because hermes fully replaces it there.
botserver:
  enabled: true

# media-proxy off by default; devops/values/{production,staging}.yaml turn it
# on. Off-by-default matters here because the chart is useless without the
# scoped S3 credential secret — rendering it into an environment that has not
# been provisioned by devops/minio/media-svcacct.sh would produce pods that
# crash-loop on the missing S3_ACCESS_KEY_ID.
media-proxy:
  enabled: false

cockroachdb:
  enabled: true

kakfka:
  enabled: true

exodus:
  api:
    enabled: true
