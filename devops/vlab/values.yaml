# empty, use deploy values
#
#
# Hermes off by default; staging.yaml sets hermes.enabled: true. This keeps the
# staging-only -wa ingester from ever rendering in production.
hermes:
  enabled: false

# botserver on by default (production still runs it); staging.yaml sets
# botserver.enabled: false because hermes fully replaces it there.
botserver:
  enabled: true

# media-proxy off by default; devops/values/{production,staging}.yaml turn it
# on. Off-by-default matters here because the chart is useless without the
# scoped S3 credential secret — rendering it into an environment that has not
# been provisioned by devops/minio/media-svcacct.sh would produce pods that
# crash-loop on the missing S3_ACCESS_KEY_ID.
media-proxy:
  enabled: false

cockroachdb:
  enabled: true

kakfka:
  enabled: true

exodus:
  api:
    enabled: true

# The media handle reconciler CronJob (templates/media-reconciler-cronjob.yaml,
# planning/media-abstraction.md §2/§11.3).
#
# OFF BY DEFAULT, and for the same reason media-proxy is: it needs the scoped
# MinIO service account provisioned by devops/minio/media-svcacct.sh. Rendering
# it into an unprovisioned environment gives an hourly job that fails to read
# any bytes — which is a noisy nothing, since every send still works by URL.
#
# The values below are the DEFAULTS. devops/values/{production,staging}.yaml
# override the schedule and enable it. TTLs are deliberately not here: Meta's
# 90 days (Messenger) and 30 days (WhatsApp) are facts, not preferences, and
# they live in DEFAULT_RECONCILE_POLICY next to the code that writes expires_at.
mediaReconciler:
  enabled: false
  schedule: "17 * * * *"
  # Refresh a handle once it is within this margin of expiry, so a handle the
  # reconciler has not reached yet degrades to a URL send rather than failing
  # (§6, mediaresolve.Resolve). MUST be comfortably larger than the schedule
  # interval, or a handle can expire between ticks. The unit is required —
  # a bare "72" is refused at startup rather than read as 72 milliseconds.
  refreshMargin: "72h"
  # ---- The per-run bound (§10) ------------------------------------------
  # Desired state is assets x accounts, which grows multiplicatively, and one
  # production user has 29 messaging accounts (§11.1b). Every action is a file
  # upload to Meta of up to 100 MB, so an unbounded pass is not a run, it is an
  # incident: connecting one account for that user turns their whole library
  # into uploads in a single tick.
  #
  # TWO bounds, because count is the wrong unit on its own — 200 actions is a
  # few seconds of thumbnails or 20 GB of documents. Whatever does not fit is
  # DEFERRED TO THE NEXT TICK AND NAMED IN THE LOG; a silent cap reads as
  # "covered everything" when it did not.
  maxActions: 200
  maxBytes: 536870912 # 512 MiB
  # "off" keeps handles for accounts the owner no longer has. They are never
  # looked up, so this is a debugging affordance, not a correctness knob.
  prune: "on"
  # Hard stop well inside the schedule interval, so a wedged pass cannot still
  # be holding `concurrencyPolicy: Forbid` when the next one is due.
  activeDeadlineSeconds: 2400
  resources:
    requests:
      cpu: 50m
      # Holds one asset's bytes in memory at a time (up to the 100 MB document
      # cap) while fanning them out to that asset's accounts.
      memory: 256Mi
    limits:
      memory: 512Mi

# The chatroach.messages account_id/platform backfill Job
# (templates/messages-backfill-job.yaml, planning/backfill-in-cluster-job.md).
#
# OFF BY DEFAULT, and this one matters more than most: it is a ~41-hour write
# across a 107M-row, 388 GiB table. It must never render because someone ran a
# helm upgrade in an environment nobody thought about.
#
# It is also ONE-SHOT. Unlike mediaReconciler this is not a standing mechanism;
# it exists to close a historical gap once, and after it completes the right
# state for every environment is `enabled: false` again.
messagesBackfill:
  enabled: false
  image:
    repository: ghcr.io/vlab-research/backfill
    tag: v0.1.0
    pullPolicy: IfNotPresent
  # 20000 is the tool's own default and was what the production timing was
  # measured at. Raising it does NOT shorten the run -- the cost is per-row, not
  # per-round-trip -- but it does make each batch hold locks for longer.
  batchSize: 20000
  # A safety stop, not a target. Production needs ~5,350 batches.
  maxBatches: 20000
  statementTimeout: "10m"
  # Persist the resume cursor in chatroach.backfill_cursor under this key, so a
  # restarted pod resumes by itself instead of re-walking the keyspace. Empty
  # disables it and puts recovery back on scraping the pod log.
  # REQUIRES devops/migrations/31-backfill-cursor.sql.
  cursorKey: "messages-account-backfill"
  # Safe only BECAUSE the cursor is durable: each retry resumes rather than
  # starting over. Set this to 0 if cursorKey is empty.
  backoffLimit: 3
  # Unset means NO DEADLINE, which is what a run of projected -- not
  # guaranteed -- duration needs. Setting a number here kills the job mid-batch
  # when it expires.
  activeDeadlineSeconds: ~
  # Extra flags, e.g. an operator-supplied --start-hsh/--start-userid override.
  extraArgs: []
  # The database does the work; this process moves a cursor.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
