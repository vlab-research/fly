apiVersion: v2
name: vlab
description: A Helm chart for Kubernetes
type: application
version: 0.0.1
dependencies:
  - name: replybot
    version: 0.0.1
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  - name: botserver
    version: 0.0.2
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
    condition: botserver.enabled
  - name: linksniffer
    version: 0.0.2
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  - name: dashboard
    version: 0.0.2
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  - name: formcentral
    version: 0.0.1
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  - name: dinersclub
    # 0.0.2 adds the metrics Service + ServiceMonitor. dinersclub is the first
    # application service in this repo Prometheus scrapes; without it the
    # transient/precondition failures classify.go withholds leave no record
    # anywhere. See planning/payment-failure-handling.md §0.2.
    version: 0.0.2
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
    tags:
      - payments
  - name: dean
    version: 0.0.3
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
    tags:
      - dean
  - name: scribble
    version: 0.0.1
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
    tags:
      - scribble
  - name: exporter
    version: 0.1.0
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
    tags:
      - exporter
  - name: exodus
    version: 0.1.0
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  - name: message-worker
    version: 0.1.1
    repository: oci://us-west1-docker.pkg.dev/toixotoixo/vlab-research/charts
  # TODO: the below charts should be moved to OCI conformant registries
  # but can not be found
  - name: naughtybot
    version: 0.0.1
    repository: https://vlab-research.github.io/fly
    tags:
      - naughtybot
  - name: botscribe
    version: 0.0.1
    repository: https://vlab-research.github.io/fly
    tags:
      - botscribe
  - name: scratchbot
    version: 0.0.1
    repository: https://vlab-research.github.io/fly
    tags:
      - scratchbot

# TODO: move database out of here (treat as provider)
# add init job to create database and users
  - name: cockroachdb
    version: 13.0.3
    condition: cockroachdb.enabled
    repository: https://charts.cockroachdb.com/
    tags:
      - cockroach

  - name: kafka
    version: 32.4.3
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled
    tags:
      - kafka

  - name: redis
    version: 18.0.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
    tags:
      - redis

  # Hermes — Rust webhook ingester (drop-in for botserver). Vendored from the
  # in-repo chart; gated off by default so it only renders where hermes.enabled
  # is set true (staging), never in production.
  - name: hermes
    version: 0.1.0
    repository: "file://../../hermes/chart"
    condition: hermes.enabled

  # media-proxy — the sole public read path for media assets (§4.4). Vendored
  # from the in-repo chart, following hermes rather than the OCI registry: the
  # chart's shape changes in lockstep with devops/values/<env>.yaml, and a
  # separately-versioned artifact would let the two drift.
  # Gated off by default; devops/values/{production,staging}.yaml turn it on.
  - name: media-proxy
    version: 0.1.0
    repository: "file://../../media-proxy/chart"
    condition: media-proxy.enabled
