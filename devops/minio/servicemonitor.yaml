# Scrape MinIO into Prometheus.
#
# Bucket metrics did not exist before: devops/alerts/templates/media-storage-capacity.yaml
# could not have been written without this endpoint, because the `media` bucket
# has NO lifecycle rule and only grows (planning/media-abstraction.md §4.5), so
# bucket size is a signal we now have to be able to read.
#
# CORRECTION (verified 2026-08-10, during the distributed cutover): an earlier
# version of this comment said MinIO "was never a Prometheus target at all".
# That is false. A SECOND ServiceMonitor also named `minio` -- left behind by
# the Bitnami chart (minio-12.6.4) that no longer deploys this -- had lived in
# the `monitoring` namespace for three years, scraping /minio/v2/metrics/cluster
# on port `minio-api`. Bucket metrics are new here; cluster metrics were not.
#
# It double-matched once this file landed, because its selector matched both
# `minio` and the new `minio-headless` Service and both expose a port named
# `minio-api`, so cluster metrics were briefly ingested THREE times per pod. It
# was deleted on 2026-08-10 (`kubectl -n monitoring delete servicemonitor
# minio`) after confirming no helm release owned it; scraping is now single-
# sourced from this file. See planning/minio-distributed-redeploy.md §12.
#
# The lesson that outlived it: `sum()` over a MinIO CLUSTER metric is wrong even
# with one ServiceMonitor, because every node reports the cluster-wide value.
# Use max(). See the MinioDrivesOffline note in media-storage-capacity.yaml.
#
# MINIO_PROMETHEUS_AUTH_TYPE=public is already set on the pods
# (devops/minio/minio.yaml), so these endpoints need no bearer token.
#
# Prometheus targets ALL ServiceMonitors in all namespaces
# (serviceMonitorSelector: {} in devops/prometheus/values.yaml), so no release
# label is required here.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/instance: minio
    app.kubernetes.io/name: minio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: minio
      app.kubernetes.io/name: minio
  namespaceSelector:
    matchNames:
      - minio
  endpoints:
    # Cluster-level: capacity, drives online/offline, healing.
    - port: metrics
      path: /minio/v2/metrics/cluster
      interval: 30s
      scrapeTimeout: 25s
    # Per-bucket: minio_bucket_usage_total_bytes / minio_bucket_usage_object_total.
    #
    # These are produced by MinIO's background SCANNER, not computed per scrape,
    # so they move in steps on the order of minutes-to-hours rather than
    # continuously. That is fine for a capacity signal and is exactly why the
    # alerts built on it use long `for:` windows and generous thresholds — it
    # must never be read as a real-time gauge.
    - port: metrics
      path: /minio/v2/metrics/bucket
      interval: 5m
      scrapeTimeout: 1m
