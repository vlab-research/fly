{{- if .Values.studyHealth.enabled }}
{{- $runbook := .Values.runbookUrl }}
{{/*
  TAXONOMY CONTRACT — sites 5 and 6 of 6.

  Single source of truth: documentation/study-error-alerting.md ("Taxonomy
  contract"). Walk its "Consumer inventory" table before changing a mapping.

  Two things in this file encode the taxonomy:
   - `category="..."` matchers pick which BLOCKED categories alert (site 5).
   - `error_tag=~"INTERNAL|STATE_ACTIONS|NETWORK"` is the platform-vs-study
     split (site 6). sql_exporter exports error_tag RAW, so this regex IS the
     classification — and it is repeated THREE times below. All three must
     change together; a partial edit silently reclassifies errors in some
     rules but not others.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vlab-study-health
  labels:
    release: prometheus
    app.kubernetes.io/name: vlab-alerts
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  groups:
    - name: vlab-study-health-recordings
      interval: 1m
      rules:
        # Recording rule: error ratio per form (1h window).
        # Denominator clamped to 1 to prevent div-by-zero for inactive forms.
        #
        # form!="(none)" excludes states with no current_form. This is a PER-FORM
        # record — a ratio for "(none)" is not a study and cannot be actioned, and
        # without the guard those errors would land in a synthetic form series that
        # SurveyErrorSpike would then page on. Platform-wide rules deliberately do
        # NOT carry this guard; see the note above PlatformInternalErrors.
        - record: survey:error_ratio:1h
          expr: |
            sum by (form) (survey_error_states{form!="{{ .Values.studyHealth.nullForm }}"})
            /
            clamp_min(sum by (form) (survey_active_users{form!="{{ .Values.studyHealth.nullForm }}"}), 1)

        # Fleet-wide error ratio — what "normal" looks like right now. The fallback form
        # is excluded from BOTH sides: it is 100% error by design and would drag the
        # baseline up, masking a real study regression.
        - record: survey:error_ratio:fleet:1h
          expr: |
            sum(survey_error_states{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"})
            /
            clamp_min(sum(survey_active_users{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"}), 1)

        # How far above the fleet baseline a single study sits.
        #
        # THIS IS THE COLUMN THAT TELLS YOU WHICH BOARD TO BE ON. A 40% error ratio means
        # something completely different when the fleet is at 4% (that study is broken)
        # than when the fleet is at 35% (everything is broken — go to Live Traffic).
        # During a platform-wide event every study rises together and excess collapses
        # toward zero. That asymmetry is the point.
        - record: survey:error_ratio_excess:1h
          expr: |
            survey:error_ratio:1h{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"}
            - on() group_left()
            survey:error_ratio:fleet:1h

        # Breadth — how many distinct studies carry platform-fault vs study-fault errors.
        # `> 0` is MANDATORY: these gauges emit zero-valued series for every group seen in
        # the scan window, so a bare count() counts the whole fleet (this exact bug shipped
        # to Live Traffic's stat panels on 2026-07-25).
        # `or vector(0)` keeps the series alive when nothing is erroring, so Grafana renders
        # a reassuring 0 instead of "No data".
        - record: survey:erroring_studies:platform:1h
          expr: |
            count(count by (study) (survey_error_states{error_tag=~"INTERNAL|STATE_ACTIONS|NETWORK"} > 0)) or vector(0)

        - record: survey:erroring_studies:study_side:1h
          expr: |
            count(count by (study) (survey_error_states{error_tag!~"INTERNAL|STATE_ACTIONS|NETWORK", form!="{{ .Values.studyHealth.fallbackForm }}"} > 0)) or vector(0)

    - name: vlab-study-health-alerts
      interval: 1m
      rules:
        # Platform-wide internal errors (INTERNAL, STATE_ACTIONS, NETWORK) indicate
        # a platform regression (DB, state machine, network, infra). Rare and always
        # actionable. Pages immediately.
        #
        # !! DELIBERATELY NO form!="(none)" GUARD. This is a bare sum across every
        # !! form, and states with NO current_form are exactly the ones this alert was
        # !! blind to before 2026-07-26 — 37 of 67 platform errors over 30 days. A
        # !! platform regression frequently has no form precisely BECAUSE the platform
        # !! failed before a form was resolved. Adding a guard here would restore the
        # !! bug. Same reasoning for PlatformRateLimited below.
        - alert: PlatformInternalErrors
          expr: |
            sum(survey_error_states{error_tag=~"INTERNAL|STATE_ACTIONS|NETWORK"}) >= {{ .Values.studyHealth.platformInternalErrorsThreshold }}
          for: {{ .Values.studyHealth.platformInternalErrorsFor }}
          labels:
            severity: critical
            component: study-health
          annotations:
            summary: "Platform internal errors detected ({{`{{ $value }}`}} in last hour)"
            description: >-
              {{`{{ $value }}`}} survey users hit INTERNAL, STATE_ACTIONS, or NETWORK
              errors in the past hour. These errors are never expected and indicate a
              platform regression (database issues, state machine bugs, network failures,
              or infrastructure problems). Threshold: {{ .Values.studyHealth.platformInternalErrorsThreshold }}
              (v1, tunable — current traffic is ~8 active users/hr total).
            runbook_url: "{{ $runbook }}#platforminternalerrors"

        # SAME SIGNAL AS ABOVE, MUCH HIGHER BAR — and it exists for a different
        # audience. This alert does not page anyone; its only consumer is the
        # researcher-facing notice in the dashboard, via the `platformNotices`
        # whitelist in dashboard-server/api/health/rules.js.
        #
        # ⚠️ THIS IS A HAND-MAINTAINED COUPLING. dashboard-server whitelists this
        # ⚠️ alertname and DROPS anything unlisted, so renaming this alert silently
        # ⚠️ removes the researcher notice with no error anywhere. The paging alert
        # ⚠️ above is deliberately NOT in that whitelist — do not re-add it.
        #
        # Why two rules instead of one: the notice is driven by alert firing state,
        # so differing thresholds require differing alerts. The platform on-call
        # wants the earliest possible warning and can triage an error_tag breakdown;
        # a researcher cannot, and reads any such banner as "stop my surveys". At
        # the paging threshold of 5 — which sits inside the flat 1-6 background of
        # the lost-`md` stuck population — that banner was effectively always on.
        #
        # The ratio and the active-user floor are BOTH load-bearing. Active users
        # swing 13 -> 1107 across a day while the error count stays flat, so a ratio
        # without a volume floor fires at 3am on 6 stuck users and a floor without a
        # ratio ignores traffic entirely. Neither gate is redundant; see values.yaml.
        #
        # No form!="(none)" guard, for the same reason as the paging alert above.
        - alert: PlatformInternalErrorsSevere
          expr: |
            (
              sum(survey_error_states{error_tag=~"INTERNAL|STATE_ACTIONS|NETWORK"}) >= {{ .Values.studyHealth.platformInternalErrorsSevereThreshold }}
            )
            and
            (
              sum(survey_error_states{error_tag=~"INTERNAL|STATE_ACTIONS|NETWORK"})
              /
              clamp_min(sum(survey_active_users), 1) >= {{ .Values.studyHealth.platformInternalErrorsSevereRatio }}
            )
            and
            (
              sum(survey_active_users) >= {{ .Values.studyHealth.platformInternalErrorsSevereMinActive }}
            )
          for: {{ .Values.studyHealth.platformInternalErrorsSevereFor }}
          labels:
            # info, NOT critical: the on-call has already been paged by
            # PlatformInternalErrors long before this fires. Escalating here would
            # double-page for one incident.
            severity: info
            component: study-health
            audience: researcher
          annotations:
            summary: "Platform internal errors SEVERE ({{`{{ $value }}`}} users) — researchers are being notified"
            description: >-
              {{`{{ $value }}`}} survey users hit INTERNAL, STATE_ACTIONS, or NETWORK errors
              in the past hour — at least {{ .Values.studyHealth.platformInternalErrorsSevereThreshold }}
              users AND at least {{ .Values.studyHealth.platformInternalErrorsSevereRatio }} of all
              active users, sustained {{ .Values.studyHealth.platformInternalErrorsSevereFor }}.
              This is far above the normal background and indicates a broad, live platform
              failure rather than the known stuck population. THIS ALERT IS VISIBLE TO
              RESEARCHERS: while it fires, every survey owner sees a banner in their
              dashboard telling them the platform is degraded. PlatformInternalErrors
              (the paging alert) will already be firing — triage there.
            runbook_url: "{{ $runbook }}#platforminternalerrors"

        # Facebook API rate-limiting our pages. When this fires, Facebook is actively
        # throttling us across surveys. Immediate platform issue requiring action.
        - alert: PlatformRateLimited
          expr: |
            sum(survey_blocked_states{category="rate_limit"}) >= {{ .Values.studyHealth.platformRateLimitThreshold }}
          for: {{ .Values.studyHealth.platformRateLimitFor }}
          labels:
            severity: critical
            component: study-health
          annotations:
            summary: "Facebook rate-limiting detected ({{`{{ $value }}`}} users blocked in last hour)"
            description: >-
              {{`{{ $value }}`}} survey users were blocked by Facebook rate-limiting (code 2022)
              in the past hour. This indicates the platform is hitting Meta's API limits.
              Threshold: {{ .Values.studyHealth.platformRateLimitThreshold }}
              (v1, tunable — current traffic is ~8 active users/hr total).
            runbook_url: "{{ $runbook }}#platformratelimited"

        # A single study's Meta template is missing or unapproved (code 100). This is
        # a study configuration issue, not platform-wide. Create a ticket for that study.
        - alert: SurveyTemplateMissing
          expr: |
            sum by (form) (survey_blocked_states{category="template_missing", form!="{{ .Values.studyHealth.nullForm }}"}) >= {{ .Values.studyHealth.surveyTemplateMissingThreshold }}
          for: {{ .Values.studyHealth.surveyTemplateMissingFor }}
          labels:
            severity: warning
            component: study-health
          annotations:
            summary: "Survey form {{`{{ $labels.form }}`}} missing Meta template ({{`{{ $value }}`}} users blocked)"
            description: >-
              {{`{{ $value }}`}} users in survey {{`{{ $labels.form }}`}} were blocked by Facebook
              code 100 (template_missing) in the past hour. The study's Meta message template
              is missing or not approved. This is a study-level configuration issue.
              Threshold: {{ .Values.studyHealth.surveyTemplateMissingThreshold }}
              (v1, tunable — current per-form traffic is ~0-3 users/hr).
            runbook_url: "{{ $runbook }}#surveytemplateMissing"

        # A single active study is experiencing a high error rate (>50% of users hitting
        # errors). Requires minimum volume to avoid noise on low-traffic forms. Creates
        # a ticket for that study.
        - alert: SurveyErrorSpike
          expr: |
            (
              survey:error_ratio:1h{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"} > {{ .Values.studyHealth.surveyErrorRatioThreshold }}
            )
            and on(form)
            (
              sum by (form) (survey_error_states{form!="{{ .Values.studyHealth.nullForm }}"}) >= {{ .Values.studyHealth.surveyErrorMinErrors }}
            )
            and on(form)
            (
              sum by (form) (survey_active_users{form!="{{ .Values.studyHealth.nullForm }}"}) >= {{ .Values.studyHealth.surveyErrorMinActiveUsers }}
            )
          for: {{ .Values.studyHealth.surveyErrorSpikeFor }}
          labels:
            severity: warning
            component: study-health
          annotations:
            summary: "Survey form {{`{{ $labels.form }}`}} error spike ({{`{{ printf \"%.1f\" $value }}`}} error ratio)"
            description: >-
              Survey {{`{{ $labels.form }}`}} has an error ratio of {{`{{ printf "%.1f" $value }}`}}
              (threshold >0.5) with sufficient volume (≥{{ .Values.studyHealth.surveyErrorMinActiveUsers }}
              active users and ≥{{ .Values.studyHealth.surveyErrorMinErrors }} errors). This is a
              study-level issue (bad form configuration, broken question logic, or study-specific
              integration problem). Form 305 (fallback) is excluded. Thresholds are v1, tunable —
              current per-form traffic is ~0-3 users/hr.
            runbook_url: "{{ $runbook }}#surveyerrorspike"

        # Three or more active studies erroring simultaneously (>30% error rate each) with
        # sufficient volume. This pattern indicates a platform regression, not study issues.
        # Pages immediately.
        - alert: MultiSurveyErrorRegression
          expr: |
            count(
              (
                survey:error_ratio:1h{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"} > {{ .Values.studyHealth.multiSurveyErrorRatioThreshold }}
              )
              and on(form)
              (
                sum by (form) (survey_active_users{form!="{{ .Values.studyHealth.nullForm }}"}) >= {{ .Values.studyHealth.multiSurveyErrorMinActiveUsers }}
              )
            ) >= {{ .Values.studyHealth.multiSurveyErrorCount }}
          for: {{ .Values.studyHealth.multiSurveyErrorFor }}
          labels:
            severity: critical
            component: study-health
          annotations:
            summary: "Multiple surveys erroring simultaneously ({{`{{ $value }}`}} surveys with >0.3 error ratio)"
            description: >-
              {{`{{ $value }}`}} surveys are experiencing error ratios above 0.3
              simultaneously (minimum {{ .Values.studyHealth.multiSurveyErrorMinActiveUsers }}
              active users per survey). When ≥{{ .Values.studyHealth.multiSurveyErrorCount }}
              studies degrade at once, this indicates a platform regression rather than
              study-specific issues. Form 305 (fallback) is excluded. Thresholds are v1,
              tunable — current per-form traffic is ~0-3 users/hr.
            runbook_url: "{{ $runbook }}#multisurveyerrorregression"

        # Users stuck on a single question (validation loop or confusing form). This is
        # a study UX issue (bad validation logic, impossible-to-answer question). Create
        # a ticket for that study.
        #
        # The fallback form is excluded, as it is from every other per-form rule here.
        # It omits users who never resolve to a real form, so they are "stuck" on it
        # permanently and by design — there is no study to ticket. That exclusion was
        # missing until 2026-08-04 and made this the noisiest study alert we had: 13
        # firing episodes / 29h of firing in 4 days, all of them form 305.
        - alert: SurveyStuckUsersSpike
          expr: |
            survey_stuck_users{form!="{{ .Values.studyHealth.fallbackForm }}", form!="{{ .Values.studyHealth.nullForm }}"} >= {{ .Values.studyHealth.surveyStuckUsersThreshold }}
          for: {{ .Values.studyHealth.surveyStuckUsersFor }}
          labels:
            severity: warning
            component: study-health
          annotations:
            summary: "Survey form {{`{{ $labels.form }}`}} has {{`{{ $value }}`}} stuck users"
            description: >-
              Survey {{`{{ $labels.form }}`}} has {{`{{ $value }}`}} users stuck on a single
              question for the past hour. This typically indicates a validation loop (form
              rejects every answer) or a confusing/impossible question. This is a study UX issue.
              Threshold: {{ .Values.studyHealth.surveyStuckUsersThreshold }}
              (v1, tunable — current per-form stuck count is 0-2).
            runbook_url: "{{ $runbook }}#surveystuckusersspike"

        # The messaging provider is failing us: either returning its own internal errors
        # (provider_error / Meta code -1) or unreachable before we sent anything
        # (provider_unreachable / code NULL or 0). Both were previously bucketed into
        # `other`, which no rule references — so this entire class was silent.
        #
        # by (page), NOT by (form) — a provider failure is a CHANNEL fault. It hits every
        # form on that page, so a form-scoped rule fires N times and looks like N
        # unrelated study problems instead of one outage. No form!="(none)" guard for the
        # same reason: this is not a per-study alert.
        - alert: ProviderErrors
          expr: |
            sum by (page) (survey_blocked_states{category=~"provider_error|provider_unreachable"}) >= {{ .Values.studyHealth.providerErrorsThreshold }}
          for: {{ .Values.studyHealth.providerErrorsFor }}
          labels:
            severity: critical
            component: study-health
          annotations:
            summary: "Messaging provider failing on page {{`{{ $labels.page }}`}} ({{`{{ $value }}`}} users blocked)"
            description: >-
              {{`{{ $value }}`}} users on page {{`{{ $labels.page }}`}} were blocked in the past
              hour by a provider-side failure — either Meta returning its own internal error
              (code -1) or the platform never reaching Meta at all (code NULL/0, meaning no
              HTTP request was made, typically a missing page access token). These users are
              NOT churn and NOT a study misconfiguration: they wanted to participate and the
              channel failed them. Check the `code` label to tell the two apart.
              Threshold: {{ .Values.studyHealth.providerErrorsThreshold }} sustained
              {{ .Values.studyHealth.providerErrorsFor }} (v1, calibrated against a measured
              1-11/hr background — tunable).
            runbook_url: "{{ $runbook }}#providererrors"

        # Users in WAIT_EXTERNAL_EVENT state past timeout. Dean (external event processor)
        # is not clearing timeouts. Platform issue requiring investigation.
        #
        # No form!="(none)" guard — deliberate, same reasoning as PlatformInternalErrors:
        # this is a bare platform-wide sum and Dean stalling is not a per-study fault.
        - alert: DeanExpiredWaits
          expr: |
            sum(survey_expired_waits) >= {{ .Values.studyHealth.deanExpiredWaitsThreshold }}
          for: {{ .Values.studyHealth.deanExpiredWaitsFor }}
          labels:
            severity: warning
            component: study-health
          annotations:
            summary: "{{`{{ $value }}`}} survey users stuck in expired WAIT_EXTERNAL_EVENT"
            description: >-
              {{`{{ $value }}`}} survey users are in WAIT_EXTERNAL_EVENT state past their
              timeout in the past hour. Dean (the external event processor) is not clearing
              these timeouts. This is a platform issue (Dean not running, not processing
              events, or integration failure). Threshold: {{ .Values.studyHealth.deanExpiredWaitsThreshold }}
              (v1, tunable — current expired waits are 0-2 total).
            runbook_url: "{{ $runbook }}#deanexpiredwaits"
{{- end }}
