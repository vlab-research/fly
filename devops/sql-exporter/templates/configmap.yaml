apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sql-exporter.fullname" . }}
  labels:
    {{- include "sql-exporter.labels" . | nindent 4 }}
data:
  config.yml: |
    # Global connection configuration for CockroachDB study health metrics.
    target:
      data_source_name: {{ .Values.database.dataSourceName | quote }}
      # Protect the DB: run collectors at most every min_interval (60s).
      collectors:
        - study_health
        - study_traffic
        - media_health
        - recruitment_health

    # ---------------------------------------------------------------------------
    # INDEX DISCIPLINE — read before adding or editing any query here.
    #
    # chatroach.states has NO index leading with `updated`. The usable indexes are
    # states_current_state_updated_idx and states_current_state_current_form_updated_idx,
    # both of which lead with current_state. A query that filters only on
    # `updated > NOW() - INTERVAL ...` therefore FULL SCANS the table — measured on
    # prod 2026-07-25: 1,072,959 rows, 1.23s per call. `states` holds one sticky row
    # per user and is never garbage-collected, so that scan grows forever.
    #
    # Pinning current_state = ANY(STATE_MACHINE_STATES) lets CockroachDB build tight
    # (current_state, updated > t) spans instead: same result, 200-320ms. This is the
    # same fix applied to dashboard-server's healthSummary (commit 413d6774).
    #
    # THE TRADEOFF: a state machine state missing from the enumeration is INVISIBLE
    # to every metric below — silently dropped from counts AND from the
    # survey_active_users denominator that survey:error_ratio:1h divides by, which
    # would inflate the ratio and fire alerts. KEEP IN SYNC with the state machine
    # (botserver-core) and with dashboard-server's STATE_MACHINE_STATES.
    # Verified complete against 30 days of prod data on 2026-07-25 (zero rows
    # outside the list).
    # ---------------------------------------------------------------------------

    # ---------------------------------------------------------------------------
    # SHORTCODE 305 IS A REAL SURVEY. Do not special-case it here.
    #
    # Until 2026-07-27 every query below carried
    #   CASE WHEN a.form = '305' THEN 'fallback (no study)' ELSE ... END
    # which OVERWROTE the real survey name for shortcode 305. That was factually
    # wrong. 305 is simultaneously (a) the global FALLBACK_FORM target and (b) a
    # live survey belonging to a real researcher. Verified on prod 2026-07-27:
    # 50 survey versions carry shortcode '305', it currently resolves to survey
    # "MENtality" / worldbank@vlab.digital, and over 24h it had 218 users reach END
    # alongside its 164 FORM_NOT_FOUND errors. Labelling all of that
    # "fallback (no study)" destroyed a real researcher's real study.
    #
    # The special case also caused the bug that triggered the 2026-07 dashboard
    # review: some panels filtered on study!="fallback (no study)" and some did not,
    # so a headline stat and the chart beneath it disagreed.
    #
    # 305 is now resolved exactly like any other shortcode. EXCLUDING it is the
    # dashboard reader's decision, made with the shortcode filter — not a decision
    # baked into the query where nobody can see it. No alert rule matches on the
    # `study` label (they match on form / error_tag / category), so removing the
    # CASE changes no alerting behaviour.
    # ---------------------------------------------------------------------------

    # Study health collector: 6 queries exposing survey error/blocked/stuck/expired/active states
    # as Prometheus gauges. All queries window on updated > NOW() - INTERVAL '1 hour' to surface
    # recent activity; labels are ONLY form + tag/category/state — NO user-identifying data.
    #
    # TAXONOMY CONTRACT: the error_tag / fb_error_code bucketing below is a shared contract —
    # documentation/study-error-alerting.md ("Taxonomy contract") is the single source of
    # truth. The classification is hand-maintained in SIX places across four languages; this
    # file is site 4. Do NOT change a mapping here without walking the "Consumer inventory"
    # table in that doc — the other five sites are in dashboard-server (SQL + two JS arrays)
    # and devops/alerts/templates/study-health.yaml (PromQL matchers, one regex repeated 3x).
    #
    # All six sites were reconciled 2026-07-29. provider_error (-1) and
    # provider_unreachable (NULL/'0') had lived here alone since 2026-07-26 —
    # dashboard-server silently bucketed both into 'other' for a month.
    #
    # NOTE ON LABEL NAMES: this collector keeps the legacy names `form` (= shortcode)
    # and `study` (= survey_name) because every alert and recording rule in
    # devops/alerts/templates/study-health.yaml matches on `form`. The study_traffic
    # collector below, which no rule reads, uses the accurate names
    # `shortcode` / `survey` / `researcher` instead. See the comment there.
    collectors:
      - collector_name: study_health
        min_interval: {{ .Values.database.minInterval }}s
        metrics:
          # survey_error_states{form,error_tag,page,study}
          # Gauges ERROR state counts by form, error_tag and page (1h window).
          #
          # NULL current_form is exported as '(none)', NOT dropped. Dropping it hid 55% of
          # all platform-fault errors — 37 of 67 INTERNAL/STATE_ACTIONS/NETWORK over 30
          # days (measured 2026-07-26) — from PlatformInternalErrors, a *paging* alert. A
          # platform regression frequently has no form precisely BECAUSE the platform
          # failed before a form was resolved, so those are the errors that matter most.
          # Per-form alert rules exclude the sentinel; platform-wide rules must not.
          #
          # `page` costs almost nothing (pageid is on the row, no join) and is the axis
          # that separates a channel failure from a study failure.
          - metric_name: survey_error_states
            type: gauge
            help: "Count of users in ERROR state by form, error_tag and page (1h window)"
            key_labels:
              - form
              - error_tag
              - page
              - study
            values:
              - value
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS form,
                  COALESCE(error_tag, 'none') AS error_tag,
                  pageid AS page,
                  COUNT(*) AS value
                FROM states
                WHERE current_state = 'ERROR'
                  AND updated > NOW() - INTERVAL '1 hour'
                GROUP BY 1, 2, 3
              )
              SELECT
                a.form AS form,
                a.error_tag AS error_tag,
                a.page AS page,
                COALESCE(sv.survey_name, 'unknown') AS study,
                a.value AS value
              FROM agg a
              LEFT JOIN LATERAL (
                SELECT survey_name
                FROM surveys
                WHERE shortcode = a.form
                ORDER BY created DESC
                LIMIT 1
              ) sv ON true;

          # survey_blocked_states{form,category,code,page,study}
          # Gauges BLOCKED state counts by form, category, RAW provider code, and page.
          #
          # THE RAW `code` IS THE POINT. This metric used to emit `category` only, so the
          # actual reason a user was blocked was destroyed at the exporter and `other` was
          # a bucket where signal went to die. The bucketing existed to bound cardinality
          # that does not exist: measured over 30 days there are exactly SEVEN distinct
          # fb_error_code values (10, 551, 100, NULL, -1, 190, 200). Collapsing 7 into 5
          # bought two label values and cost every diagnosis.
          #
          # `category` is retained unchanged because the alert rules match on it.
          #
          # Two categories split out of `other` on 2026-07-26, both previously silent
          # because no alert rule references `other`:
          #
          #  - provider_error  (code -1): a genuine Meta code, "(#-1) Unexpected internal
          #    error". The provider failed; we never had a chance. Real and ongoing.
          #
          #  - provider_unreachable (code NULL or '0'): we never reached the provider at
          #    all. `status 0` means no HTTP request was made. All 131 occurrences trace to
          #    message-worker failing to find a page access token during the July 2026
          #    staging/production Kafka traffic leak. The NULL is a Go serialization
          #    artifact — `Code int json:"code,omitempty"` drops the key when the status is
          #    0 (message-worker/worker.go:317).
          #    ⚠️ These users are STRUCTURALLY UNRECOVERABLE: dean retries via
          #    `fb_error_code = ANY($1)` (dean/queries.go:136) and SQL `= ANY` never matches
          #    NULL, so all 131 have sat BLOCKED for 12 days. Making them visible here is a
          #    stopgap; the fix is in message-worker. See
          #    planning/null-fb-error-code-findings.md.
          #
          # `page` is the axis that separates a channel failure from a study failure: a
          # provider outage hits every form served by one page, which a form-only view
          # renders as N unrelated study problems. Measured cost 94 -> 99 series.
          #
          # NULL current_form is exported as '(none)' rather than dropped — see
          # survey_error_states above.
          - metric_name: survey_blocked_states
            type: gauge
            help: "Count of users in BLOCKED state by form, category, raw provider code and page (1h window)"
            key_labels:
              - form
              - category
              - code
              - page
              - study
            values:
              - value
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS form,
                  CASE
                    WHEN fb_error_code IN ('10', '190', '551') THEN 'attrition'
                    WHEN fb_error_code = '100' THEN 'template_missing'
                    WHEN fb_error_code = '2022' THEN 'rate_limit'
                    WHEN fb_error_code = '200' THEN 'unsupported'
                    WHEN fb_error_code = '-1' THEN 'provider_error'
                    WHEN fb_error_code IS NULL OR fb_error_code = '0' THEN 'provider_unreachable'
                    ELSE 'other'
                  END AS category,
                  COALESCE(fb_error_code, '(none)') AS code,
                  pageid AS page,
                  COUNT(*) AS value
                FROM states
                WHERE current_state = 'BLOCKED'
                  AND updated > NOW() - INTERVAL '1 hour'
                GROUP BY 1, 2, 3, 4
              )
              SELECT
                a.form AS form,
                a.category AS category,
                a.code AS code,
                a.page AS page,
                COALESCE(sv.survey_name, 'unknown') AS study,
                a.value AS value
              FROM agg a
              LEFT JOIN LATERAL (
                SELECT survey_name
                FROM surveys
                WHERE shortcode = a.form
                ORDER BY created DESC
                LIMIT 1
              ) sv ON true;

          # survey_stuck_users{form,study}
          # Gauges count of users with stuck_on_question IS NOT NULL (1h window).
          - metric_name: survey_stuck_users
            type: gauge
            help: "Count of users stuck on a question by form (1h window)"
            key_labels:
              - form
              - study
            values:
              - value
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS form,
                  COUNT(*) AS value
                FROM states
                WHERE stuck_on_question IS NOT NULL
                  AND updated > NOW() - INTERVAL '1 hour'
                GROUP BY 1
              )
              SELECT
                a.form AS form,
                COALESCE(sv.survey_name, 'unknown') AS study,
                a.value AS value
              FROM agg a
              LEFT JOIN LATERAL (
                SELECT survey_name
                FROM surveys
                WHERE shortcode = a.form
                ORDER BY created DESC
                LIMIT 1
              ) sv ON true;

          # survey_expired_waits{form,study}
          # Gauges count of users in WAIT_EXTERNAL_EVENT with expired timeout_date (1h window).
          - metric_name: survey_expired_waits
            type: gauge
            help: "Count of users in WAIT_EXTERNAL_EVENT with expired timeout_date by form (1h window)"
            key_labels:
              - form
              - study
            values:
              - value
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS form,
                  COUNT(*) AS value
                FROM states
                WHERE current_state = 'WAIT_EXTERNAL_EVENT'
                  AND timeout_date < NOW()
                  AND updated > NOW() - INTERVAL '1 hour'
                GROUP BY 1
              )
              SELECT
                a.form AS form,
                COALESCE(sv.survey_name, 'unknown') AS study,
                a.value AS value
              FROM agg a
              LEFT JOIN LATERAL (
                SELECT survey_name
                FROM surveys
                WHERE shortcode = a.form
                ORDER BY created DESC
                LIMIT 1
              ) sv ON true;

          # survey_active_users{form,study}
          # Gauges count of all users updated in the last hour (DENOMINATOR for error proportion).
          # current_state enumeration is for index spans, not filtering — see INDEX DISCIPLINE above.
          - metric_name: survey_active_users
            type: gauge
            help: "Count of active users by form (1h window, denominator for error/blocked rates)"
            key_labels:
              - form
              - study
            values:
              - value
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS form,
                  COUNT(*) AS value
                FROM states
                WHERE current_state = ANY(ARRAY['START','RESPONDING','QOUT','END','BLOCKED',
                                                'ERROR','WAIT_EXTERNAL_EVENT','USER_BLOCKED','RESET','OFF'])
                  AND updated > NOW() - INTERVAL '1 hour'
                GROUP BY 1
              )
              SELECT
                a.form AS form,
                COALESCE(sv.survey_name, 'unknown') AS study,
                a.value AS value
              FROM agg a
              LEFT JOIN LATERAL (
                SELECT survey_name
                FROM surveys
                WHERE shortcode = a.form
                ORDER BY created DESC
                LIMIT 1
              ) sv ON true;

      # RETIRED 2026-07-25: survey_state_total{form,state} (1h state distribution).
      # Superseded by survey_recent_states below, which answers the same question on a
      # 5m window and adds the study / page / page_name dimensions. Nothing alerted on
      # it; its only consumer was one Study Health panel, removed in the same change.

      # -------------------------------------------------------------------------
      # Live traffic collector: ONE query answering "how many people are in each
      # state right now, whose survey is it, and on which page".
      #
      # WHY 5 MINUTES, not the 1h used by study_health: a 1h window smears a spike
      # across an hour and keeps it visible for an hour after it has stopped. At a 60s
      # scrape, a 5m window is a live traffic curve — it rises and falls with reality,
      # which is what makes an ERROR spike legible.
      #
      # This collector is for LOOKING AT. No alert rules read it. The 1h study_health
      # metrics remain the alerting substrate, untouched. That is also why this
      # collector is free to use ACCURATE LABEL NAMES while study_health keeps its
      # legacy ones:
      #
      #     study_traffic          study_health      what it actually is
      #     ------------------     --------------    -------------------------------
      #     researcher             (absent)          users.email — who owns the survey
      #     survey                 study             surveys.survey_name
      #     shortcode              form              surveys.shortcode
      #
      # Renaming here is safe precisely because nothing but the two Grafana
      # dashboards reads this metric, and both were rewritten alongside this change.
      # Renaming `form` in study_health is NOT safe — every alert rule matches on it.
      # -------------------------------------------------------------------------
      - collector_name: study_traffic
        min_interval: {{ .Values.database.minInterval }}s
        metrics:
          # survey_recent_states{window,state,reason,researcher,survey,shortcode,page,page_name}
          #
          # THREE WINDOWS FROM ONE SCAN. `window` is a value_label: sql_exporter emits one
          # series per value column, labelled with that column's name (5m / 1h / 24h).
          # The alternative — three separate queries — would scan the same index spans
          # three times; COUNT(*) FILTER buckets them in a single pass instead.
          #
          # Because `states` holds one sticky row per (user, page), EVERY window is a
          # DISTINCT-USER count, not a sum of buckets. window="24h" is "distinct people we
          # talked to today" (2,953 on 2026-07-25), window="5m" is "who is here right now"
          # (12 at the same moment). They answer different questions; they are not scaled
          # versions of each other.
          #
          # !! Any PromQL over this metric MUST pin the window, e.g.
          # !!   sum by (state) (survey_recent_states{window="5m"})
          # !! Omitting it sums all three windows together and silently triple-counts.
          # !! Both dashboards defend against this structurally: `window` is a
          # !! SINGLE-SELECT variable with no "All" option, so `window="$window"` can
          # !! never expand to more than one window. Do not make it multi-select.
          #
          # !! CONSEQUENCE OF ONE ROW / THREE WINDOWS: the row is selected by the WIDEST
          # !! window (24h), so a group that was busy this morning and idle since still
          # !! emits all three series — with 0 in the 5m and 1h columns. "Series exists"
          # !! therefore means "had traffic in the last 24h", NOT "has traffic in the
          # !! selected window". Measured on prod 2026-07-28 at window="5m": 121 series
          # !! present, exactly 1 non-zero; 77 shortcodes and 26 surveys enumerated, 1 of
          # !! each with anyone on it. Any panel that enumerates a dimension
          # !! (sum by (survey), sum by (shortcode), ...) MUST therefore append `> 0`, or
          # !! it draws a wall of empty bars and legend entries for surveys nobody is on.
          # !! Every such panel on the Live Traffic board does; keep it that way.
          #
          # Suppressing the zeros HERE instead was measured and rejected: unpivoting to one
          # row per (group, window) with `WHERE n > 0` costs 619ms vs 346ms median (the CTE
          # materializes to a buffer and re-scans it), and unpivoting before the joins costs
          # 767ms because the surveys LATERAL — the real cost driver — then runs 162 times
          # instead of 123. `> 0` in PromQL is free and gets the same result.
          #
          # THE `reason` LABEL IS STATE-DEPENDENT, deliberately. It is the error_tag for
          # ERROR, the raw Facebook error code for BLOCKED, and empty for every other
          # state. One label carries "why is this person here" for the only two states
          # where that question has an answer, which is what lets a single expression
          # (`sum by (reason) (...{state="ERROR"})`) drill down without a second metric.
          # Empty label values are indistinguishable from absent ones in Prometheus, so
          # `reason!=""` cleanly selects "only the states that have a reason".
          #
          # AGGREGATE FIRST, THEN RESOLVE LABELS. The researcher/survey/page joins run
          # against the ~125 grouped rows, not the ~2,953 raw rows. Joining before the
          # GROUP BY runs the LATERAL once per row and measured 2x slower (1.03s vs
          # 420-500ms) — and that gap widens with traffic, since the group count grows far
          # slower than the row count.
          #
          # Labels are resolved in SQL rather than by a PromQL `group_left` join against
          # an info metric, deliberately: an info-metric join silently DROPS any series
          # whose shortcode has no match, which on a traffic board means traffic vanishing
          # with no indication. COALESCE guarantees every row is emitted — an unresolved
          # shortcode shows up as survey="unknown" instead of disappearing.
          #
          # !! SHORTCODES ARE NOT GLOBALLY UNIQUE. There is no UNIQUE constraint on
          # !! (userid, shortcode) — measured on prod 2026-07-27, 42 of 1040 shortcodes are
          # !! owned by more than one researcher ('305' by 11, 'reset' by 6), covering 450
          # !! users in a 24h window. Resolving a shortcode WITHOUT scoping it to an account
          # !! therefore attributes one researcher's traffic to another. That bug shipped
          # !! briefly: 166 users on Mark's "TM Project" page hit the global fallback
          # !! shortcode 305, which resolves to worldbank's real "MENtality" survey, and the
          # !! board credited them to worldbank.
          #
          # So resolution mirrors what formcentral actually does (getSurveyByParams): the
          # PAGE decides the account, and the shortcode is looked up WITHIN that account.
          #
          #   researcher  <- credentials.userid for the page (facebook_page_id is UNIQUE,
          #                  so this is unambiguous and cannot fan out). This is the right
          #                  source of truth for "whose traffic is this": the participant
          #                  arrived through that researcher's page, whatever form they
          #                  landed on.
          #   survey      <- newest surveys row matching BOTH shortcode AND that account.
          #                  No match => "unknown", which is the honest answer for fallback
          #                  traffic and for typo'd/case-wrong shortcodes in referral links.
          #
          # Consequence worth understanding: fallback traffic now reads
          # researcher="<page owner>", survey="unknown" rather than being credited to
          # whoever happens to own a survey with that shortcode. survey="unknown" on a page
          # with real traffic is a SIGNAL — a broken referral link, not a gap in the data.
          #
          # Version-awareness is still approximate: the newest surveys row for the account
          # wins, rather than the row where created <= form_start_time as dashboard-server
          # does. That is a per-row correlated subquery; for recently-active users the
          # newest row is right except when a survey is renamed mid-conversation.
          #
          # Measured on prod 2026-07-27 after this change: 129 groups, 1 with no researcher
          # (a page with no credentials row), 9 with survey="unknown" (fallback + the
          # case-wrong shortcode variants), 2,770 users over 24h.
          #
          # `users` is unqualified like `states` / `surveys` / `credentials` — the DSN
          # points at the chatroach database and CockroachDB's default search_path
          # ($user, public) resolves it to chatroach.public.users, never system.users.
          #
          # Cardinality: window x state x reason x shortcode x page. researcher/survey/
          # page_name are functionally dependent on shortcode/page so they do NOT multiply
          # it — adding `researcher` cost ZERO new series (verified: the group count is
          # identical with and without the users join). Measured on prod 2026-07-27:
          # 125-131 groups over 24h => ~375-395 series, drifting by a few groups minute to
          # minute as new users arrive. Query cost 420-500ms.
          # credentials.facebook_page_id is UNIQUE, so that join cannot fan out.
          # surveys is deduped to one row by the LATERAL's LIMIT 1, so the users join
          # cannot fan out either.
          - metric_name: survey_recent_states
            type: gauge
            help: "Distinct users active within the labelled window, by state, reason, researcher, survey, shortcode and page"
            key_labels:
              - state
              - reason
              - researcher
              - survey
              - shortcode
              - page
              - page_name
            value_label: window
            values:
              - "5m"
              - "1h"
              - "24h"
            query: |
              WITH agg AS (
                SELECT
                  current_state AS state,
                  COALESCE(current_form, '(none)') AS shortcode,
                  pageid AS page,
                  CASE
                    WHEN current_state = 'ERROR'   THEN COALESCE(error_tag, '(untagged)')
                    WHEN current_state = 'BLOCKED' THEN COALESCE(fb_error_code, '(none)')
                    ELSE ''
                  END AS reason,
                  COUNT(*) FILTER (WHERE updated > NOW() - INTERVAL '5 minutes') AS c5m,
                  COUNT(*) FILTER (WHERE updated > NOW() - INTERVAL '1 hour') AS c1h,
                  COUNT(*) AS c24h
                FROM states
                WHERE current_state = ANY(ARRAY['START','RESPONDING','QOUT','END','BLOCKED',
                                                'ERROR','WAIT_EXTERNAL_EVENT','USER_BLOCKED','RESET','OFF'])
                  AND updated > NOW() - INTERVAL '24 hours'
                GROUP BY 1, 2, 3, 4
              )
              SELECT
                a.state AS state,
                a.reason AS reason,
                COALESCE(pu.email, 'unknown') AS researcher,
                COALESCE(sv.survey_name, 'unknown') AS survey,
                a.shortcode AS shortcode,
                a.page AS page,
                COALESCE(cr.details->>'name', a.page) AS page_name,
                a.c5m AS "5m",
                a.c1h AS "1h",
                a.c24h AS "24h"
              FROM agg a
              LEFT JOIN credentials cr ON cr.facebook_page_id = a.page
              LEFT JOIN users pu ON pu.id = cr.userid
              LEFT JOIN LATERAL (
                SELECT s.survey_name
                FROM surveys s
                WHERE s.shortcode = a.shortcode
                  AND s.userid = cr.userid
                ORDER BY s.created DESC
                LIMIT 1
              ) sv ON true;

      # -------------------------------------------------------------------------
      # RECRUITMENT ARRIVAL HEALTH — documentation/recruitment-arrival-health.md
      #
      # Every other collector here measures what happens to a conversation once it
      # exists. This one measures whether it started in the right place at all.
      #
      # The gap it closes has a specific and expensive shape. A recruitment ad
      # carries a routing token; if that token is missing, mangled, or aimed at a
      # channel the ad never reaches, getMetadata falls through to FALLBACK_FORM and
      # the respondent begins a REAL SURVEY belonging to a real researcher. Nothing
      # errors. The state machine is healthy, the error ratio is flat, and the user
      # answers questions and reaches END — they look like a completion. Every alert
      # in study-health.yaml is blind to this by construction, and the fallback form
      # is deliberately EXCLUDED from the error-ratio baselines there because it is
      # 100% error by design. It broke for four days and 1,770 users in July 2026,
      # and what eventually noticed was a person reading response data.
      #
      # Three questions, one query:
      #
      #   1. Is a study recruiting at all?         arrivals by shortcode
      #   2. Landing in the right survey?          arrivals whose shortcode IS the
      #                                            fallback form
      #   3. Through which channel?                the platform label
      #
      # (3) is what makes a multi-destination ad observable at all. Such an ad opens
      # EITHER Messenger OR WhatsApp with Meta choosing per respondent, so the only
      # way to know both arms work is to watch arrivals split across platforms for
      # one shortcode. An arm that never delivers shows as traffic on one platform
      # and none on the other; an arm whose token does not survive shows as traffic
      # on that platform landing on the fallback form. Neither is inferable from any
      # existing metric, and neither can be measured any other way short of asking
      # Meta, which does not answer.
      #
      # WHY states AND NOT responses. `states` is one sticky row per user, ~1.1M
      # rows, already scanned by every collector above; `responses` grows without
      # bound. More decisively: a misrouted arrival that answers nothing never
      # reaches `responses` at all, and that is exactly the case worth catching.
      #
      # ACCESS PATH: read the INDEX DISCIPLINE block at the top of this file first.
      # form_start_time is a computed column in NO index, so filtering on it alone
      # full scans 1.1M rows (measured: 7s). Pinning current_state and bounding
      # `updated` first lets CockroachDB build the same tight (current_state,
      # updated > t) spans the other collectors use, and form_start_time then only
      # refines rows already fetched. That refinement is sound and not merely cheap:
      # `updated` is the last write and form_start_time the conversation's start, so
      # form_start_time > t always implies updated > t — the index bound cannot
      # exclude a row the query wants.
      #
      # CARDINALITY: shortcode x platform x ad_id x page, x2 windows. Measured on
      # prod 2026-08-18: 45 groups over 24h => ~90 series, on 4,546 arrivals. `page`
      # costs 4 extra groups and is the axis that separates a channel failure from a
      # study failure, exactly as on survey_error_states.
      #
      # THE platform LABEL IS SAFE HERE, unlike the media_handle.platform trap
      # documented below. states.platform is computed from
      # state_json->'md'->>'platform' (migration 21) and replybot's eventPlatform
      # writes exactly 'messenger' or 'whatsapp' — a vocabulary pinned by code
      # rather than convention. NULL only for rows predating that stamp, which
      # COALESCE resolves to 'messenger', exact for all pre-WhatsApp data.
      # -------------------------------------------------------------------------
      - collector_name: recruitment_health
        min_interval: {{ .Values.database.minInterval }}s
        metrics:
          # survey_arrivals{shortcode,survey,researcher,platform,ad_id,page}
          #
          # A conversation is an arrival in the window if the form it is currently on
          # STARTED in that window, not if the user was merely active. Re-entrants
          # and long-running conversations are excluded, which is what makes this a
          # recruitment signal rather than a traffic one.
          #
          # THE ad_id LABEL MEANS ONE NARROW THING: replybot resolved an ad id off
          # the referral and stamped md.ad_id. It does NOT mean the arrival will join
          # to a vlab mapping row, and `absent` does NOT mean anything is broken.
          # Read the baseline before writing any rule against it:
          #
          #   - WhatsApp click-to-WhatsApp arrivals carry a referral by construction,
          #     so `present` should be the overwhelming majority there.
          #   - Messenger is the opposite, and it is not a defect. Meta sends the
          #     messaging_referrals webhook for only about a third of ad entrants;
          #     the rest arrive through the welcome message's quick-reply payload,
          #     which carries the dotted ref but no ad id. Measured over 30 days to
          #     2026-08-18: 2,475 of 7,983 Messenger ad entrants (31%) had a
          #     resolvable ad id — and every ad-sourced referral that DID arrive
          #     carried one, with zero exceptions. The shortfall is entirely webhooks
          #     Meta never sent, so no code change recovers it.
          #   - Organic entrants have no ad id and never will.
          #
          # So this is a DENOMINATOR AND AN EXPLANATION — how much of a study's
          # intake the ad-id join can reach — and a paging rule on it would fire
          # constantly on perfectly healthy Messenger studies. Alert on the fallback
          # form, which is unambiguous; look at this one.
          - metric_name: survey_arrivals
            type: gauge
            help: "Conversations whose current form STARTED within the labelled window, by shortcode, platform, ad-id presence and page"
            key_labels:
              - shortcode
              - survey
              - researcher
              - platform
              - ad_id
              - page
            value_label: window
            values:
              - "1h"
              - "24h"
            query: |
              WITH agg AS (
                SELECT
                  COALESCE(current_form, '(none)') AS shortcode,
                  COALESCE(platform, 'messenger') AS platform,
                  CASE WHEN ad_id IS NOT NULL THEN 'present' ELSE 'absent' END AS ad_id,
                  pageid AS page,
                  COUNT(*) FILTER (WHERE form_start_time > NOW() - INTERVAL '1 hour') AS c1h,
                  COUNT(*) AS c24h
                FROM states
                WHERE current_state = ANY(ARRAY['START','RESPONDING','QOUT','END','BLOCKED',
                                                'ERROR','WAIT_EXTERNAL_EVENT','USER_BLOCKED','RESET','OFF'])
                  AND updated > NOW() - INTERVAL '24 hours'
                  AND form_start_time > NOW() - INTERVAL '24 hours'
                GROUP BY 1, 2, 3, 4
              )
              SELECT
                a.shortcode AS shortcode,
                COALESCE(sv.survey_name, 'unknown') AS survey,
                COALESCE(pu.email, 'unknown') AS researcher,
                a.platform AS platform,
                a.ad_id AS ad_id,
                a.page AS page,
                a.c1h AS "1h",
                a.c24h AS "24h"
              FROM agg a
              LEFT JOIN credentials cr ON cr.facebook_page_id = a.page
              LEFT JOIN users pu ON pu.id = cr.userid
              LEFT JOIN LATERAL (
                SELECT s.survey_name
                FROM surveys s
                WHERE s.shortcode = a.shortcode
                  AND s.userid = cr.userid
                ORDER BY s.created DESC
                LIMIT 1
              ) sv ON true;

      # -------------------------------------------------------------------------
      # MEDIA HANDLE HEALTH — planning/media-abstraction.md §2, §8.5, §13.
      #
      # WHY THIS IS A SQL COLLECTOR AND NOT A COUNTER IN message-worker.
      #
      # §8.5 designed a "by-URL counter": in this architecture a by-URL send for
      # dashboard-uploaded media is an anomaly, so a counter that sits near zero is
      # a clean health signal. That reasoning is right and this collector does not
      # replace it — but the counter measures the SYMPTOM, and it only moves AFTER a
      # respondent has already been served the degraded path. It also has nowhere to
      # live today: no application service in this repo exposes /metrics at all, so
      # shipping it means standing up a metrics endpoint, a Service and a
      # ServiceMonitor for message-worker first.
      #
      # The CAUSE is visible in SQL, before any send degrades. The handle layer's
      # desired state (§2) is "one fresh handle per (asset x each of the owner's
      # messaging accounts)", and that is a query. A handle that will be expired
      # tomorrow is measurable today; a fan-out that never happened is measurable
      # the moment the upload returns. Every metric below leads the by-URL counter.
      #
      # WHAT THIS CANNOT SEE, and what still wants the §8.5 counter eventually:
      #  - Third-party URLs (§2 "out of scope"). An imgur link in a survey has no
      #    asset row, so it is invisible here and is a by-URL send forever, by
      #    design. Not a fault, but it is why the counter's floor is not zero.
      #  - Codec-level ineligibility (§11.5's weakened invariant). A file that
      #    passes upload validation and is then refused by WhatsApp gets no handle.
      #    That DOES show up here — as a permanently missing handle — but it is
      #    indistinguishable from a broken reconciler without looking at the rows.
      #  - The read path. If message-worker's lookup errors and it treats the miss
      #    as by-URL (§13's "CRDB slow or down" row), the handle rows are perfect
      #    and this collector reports perfect health while every send degrades.
      #    Nothing in SQL can see that. It is the one failure mode that genuinely
      #    requires the worker-side counter.
      #  - MEDIA_HANDLE_USE being off. Same blind spot: healthy rows, no use made
      #    of them.
      #
      # ---------------------------------------------------------------------------
      # ZERO BEHAVIOUR — read before editing any query here.
      #
      # media_asset and media_handle are EMPTY in production and stay empty until a
      # researcher uploads through the media tab (§11.1 measured zero adoption).
      # Every query below is therefore an UNGROUPED aggregate, which returns exactly
      # one row against an empty table. That is deliberate and load-bearing:
      #
      #   - the series always exist, so no alert expression silently evaluates
      #     against an absent vector, and no Grafana panel reads "No data";
      #   - the values are 0, so no alert fires merely because nobody has uploaded
      #     anything. An alert that fires on an empty table is worse than no alert;
      #   - there is no division anywhere in SQL. Ratios are built in PromQL with
      #     clamp_min() on the denominator, the same way survey:error_ratio:1h does.
      #
      # !! DO NOT ADD A GROUP BY OR A key_label HERE without re-checking that. The
      # !! obvious candidate is a `platform` label off media_handle.platform, and it
      # !! is a trap twice over: a grouped query emits ZERO series on an empty table,
      # !! and `platform` is a DESCRIPTIVE column (migration 24) whose value
      # !! vocabulary is pinned by nothing — the codebase spells platforms two ways
      # !! ('messenger'/'whatsapp' vs 'facebook_page'/'whatsapp_business') and a
      # !! label matcher written against the wrong spelling reads as a clean zero.
      # !! Per-platform triage belongs in the runbook's SQL, not in a label.
      # ---------------------------------------------------------------------------
      - collector_name: media_health
        min_interval: {{ .Values.database.minInterval }}s
        metrics:
          # media_handles_desired / media_handles_missing
          #
          # THE DESIRED STATE, AND THE GAP. §2: one handle per (asset x each of the
          # owner's messaging accounts), where the account set is
          #   SELECT key FROM credentials
          #   WHERE userid = $1 AND entity IN ('facebook_page','whatsapp_business')
          #
          # `missing` is the primary health signal of the whole handle layer. A
          # non-zero AND NON-DECREASING value means two things have failed together:
          # upload-time fan-out did not create the handle, and the reconciler is not
          # backfilling it. Either alone is harmless by design (§2 — fan-out is
          # explicitly allowed to be unreliable BECAUSE the reconciler backfills), so
          # only the conjunction is worth alerting on. Hence the alert's long `for:`.
          #
          # Expect it to be briefly non-zero after every upload: fan-out is
          # best-effort and never blocks the upload response, and the reconciler
          # tick is what closes the gap. Transient, not a fault.
          #
          # JOIN KEY IS account_id ALONE. h.account_id = c.key, with no platform
          # predicate. Read migration 24's comment before changing this: a
          # (platform, account_id) key is a silent-failure trap because the writer
          # holds credentials.entity and the reader holds SendMessageCommand's
          # platform spelling, and a lookup miss is not an error — it is the
          # designed URL fallback. A platform predicate added here would make this
          # metric report a fan-out gap that does not exist.
          #
          # ACCESS PATH (verified with EXPLAIN against migration 24's schema):
          #   merge join media_asset@(userid, content_hash) x
          #              credentials@(userid, entity, key)   -- both ordered by userid
          #   -> lookup join media_handle@media_handle_pkey  -- (asset_id, account_id)
          #                                                     equality, "equality
          #                                                     cols are key"
          # No cross product is ever materialised: the merge emits exactly `desired`
          # rows and each one costs a single primary-key seek.
          #
          # COST GROWS WITH THE DESIRED-STATE CARDINALITY, and that is irreducible
          # for an exact answer — one seek per (asset, account) pair. At today's
          # scale (zero) and the realistic near-term scale (3 media-authoring
          # researchers x 3-4 accounts x tens of assets = hundreds of seeks) it is
          # far cheaper than the study_traffic query already running beside it.
          # The number to watch is assets x accounts, NOT assets: §11.1b measured one
          # production user with 29 messaging accounts, so a single researcher can
          # multiply the row count by 29.
          #
          # !! IF media_handles_desired PASSES ~100,000, MOVE THIS METRIC TO ITS OWN
          # !! COLLECTOR with a longer min_interval (5-15m). Fan-out gaps are
          # !! reconciler-scale events measured in hours; nothing here needs 60s
          # !! resolution. That is the lever — do not "optimise" the query, there is
          # !! nothing cheaper that is still exact.
          - metric_name: media_handles_desired
            type: gauge
            help: "Desired (asset x owner's messaging account) pairs — the handle layer's target state (planning/media-abstraction.md §2)"
            values:
              - desired
            query_ref: media_fanout

          - metric_name: media_handles_missing
            type: gauge
            help: "Desired (asset x account) pairs with NO handle row — fan-out failed AND the reconciler has not backfilled"
            values:
              - missing
            query_ref: media_fanout

          # media_handles_expired
          #
          # Handles past expires_at. SHOULD BE ~0 AT ALL TIMES. A handle only gets
          # here if the reconciler has not run, or is running but not keeping up —
          # by the time expires_at has passed, the refresh margin has already been
          # open for days (see media_handles_expiring below).
          #
          # Not a respondent-facing fault on its own: §13's "handle expired,
          # reconciler hasn't run" row degrades to a by-URL send, and mediaresolve's
          # own margin (§6) catches it before the id is actually used. This is a
          # "the reconciler is dead" signal, not an outage.
          #
          # BOTH PLATFORMS EXPIRE — verified against Meta's docs 2026-08-10 (§11.2):
          # WhatsApp media ids 30 days, Messenger attachment ids 90 days. An earlier
          # draft of the design recorded Messenger as "no known expiry", under which
          # every Messenger handle would have died silently at 90 days with nothing
          # erroring and nothing alerting — and Messenger carries ~100% of live media
          # traffic (§11.1). This metric is the thing that would have caught it.
          #
          # `expires_at IS NULL` is EXCLUDED, not counted as expired. NULL now means
          # only "expiry genuinely unknown", which no current platform produces; a
          # NULL is a reconciler/writer bug, and it surfaces as a stuck
          # media_handles_missing rather than being miscounted here.
          - metric_name: media_handles_expired
            type: gauge
            help: "Handles already past expires_at — the reconciler is not running or not keeping up"
            values:
              - expired
            query_ref: media_handle_expiry

          # media_handles_expiring
          #
          # THE LEADING INDICATOR. Handles not yet expired but inside the refresh
          # margin — the set the reconciler is supposed to be working on right now.
          # It rises BEFORE media_handles_expired does, by exactly the margin, which
          # is the window in which a stalled reconciler can be fixed with no
          # degradation at all.
          #
          # A healthy system has a small, CHURNING value here: handles enter the
          # margin, the reconciler refreshes them, they leave. A value that rises
          # and then stops falling is the same fault media_handles_expired reports,
          # caught {{ .Values.media.refreshMarginHours }}h earlier.
          #
          # The margin must be >= mediaresolve's own margin (§6), or the send path
          # starts degrading to by-URL before this metric has said anything.
          - metric_name: media_handles_expiring
            type: gauge
            help: "Handles inside the refresh margin but not yet expired — leading indicator of a stalled reconciler"
            values:
              - expiring
            query_ref: media_handle_expiry

          # media_handles_dead
          #
          # platform_media_id IS NULL — migration 24's "known-dead, send by URL"
          # marker. These are handles the fan-out or reconciler tried to create and
          # the platform refused. They ALWAYS send by URL, so they are the standing
          # floor under the §8.5 by-URL counter.
          #
          # Expected to be small but NOT provably zero: §11.5's eligibility
          # invariant holds for size and MIME (enforced at upload) and NOT for
          # codecs — an H.265 MP4 or a stereo Ogg passes upload validation and is
          # then refused by WhatsApp. Such an asset is permanently dead on that
          # account. That is a KNOWN, ACCEPTED class, which is exactly why this is a
          # separate metric from media_handles_missing rather than folded into it:
          # dead means "we tried and were told no", missing means "nobody tried".
          # Conflating them would make an accepted condition look like a fault.
          #
          # NOT ALERTED ON. A rise here is a researcher-visible upload problem, not
          # a platform outage, and the actionable version of it belongs at the
          # upload validator. Exported so a by-URL reading can be explained.
          - metric_name: media_handles_dead
            type: gauge
            help: "Handles with platform_media_id IS NULL (known-dead) — these always send by URL"
            values:
              - dead
            query_ref: media_handle_inventory

          # media_handles / media_assets
          #
          # CHEAP DENOMINATORS, so everything above can be read as a rate. 50 stale
          # handles means something very different at 60 assets than at 60,000.
          # Bare gauges, no _total suffix: that suffix means "counter" in Prometheus
          # convention and these are point-in-time counts.
          #
          # media_handles is the row count of media_handle, which is NOT
          # (desired - missing). The difference is ORPHANED handles — rows for an
          # account that has since been disconnected. §5 says explicitly that no FK
          # constrains account_id (credentials rotate) and that the reconciler
          # prunes them. So:
          #
          #   media_handles - (media_handles_desired - media_handles_missing)
          #
          # is the orphan count, and a growing orphan count means the reconciler's
          # PRUNE half is not running even if its refresh half is. Verified against
          # a seeded local stack: a handle for a disconnected account contributes to
          # media_handles and to neither desired nor missing.
          - metric_name: media_handles
            type: gauge
            help: "Total media_handle rows (includes orphans for disconnected accounts) — denominator"
            values:
              - handles
            query_ref: media_handle_inventory

          - metric_name: media_assets
            type: gauge
            help: "Total media_asset rows — denominator, and the adoption signal for the media tab"
            values:
              - assets
            query_ref: media_assets

        # ---------------------------------------------------------------------------
        # Shared queries for the media_health collector.
        #
        # WHY `queries:` + `query_ref` HERE, when every collector above inlines its SQL:
        # seven metrics come from four executions instead of seven. media_handle is
        # scanned ONCE per interval for both media_handles and media_handles_dead, and
        # the fan-out join — the expensive one — runs once for both of its metrics.
        # Inlining would double its cost for no benefit.
        #
        # !! `queries:` IS A COLLECTOR-LEVEL KEY, a sibling of `metrics:` — NOT a
        # !! top-level one. Placed at the top level it parses as valid YAML and then
        # !! fails at startup with `unresolved query_ref "media_fanout" in metric
        # !! "media_handles_desired"`, so the pod CrashLoops instead of serving a
        # !! partial /metrics. Verified against burningalchemist/sql_exporter 0.24.3
        # !! by making exactly that mistake.
        # ---------------------------------------------------------------------------
        queries:
          - query_name: media_fanout
            query: |
              SELECT
                COUNT(*)::INT                                        AS desired,
                COUNT(*) FILTER (WHERE h.asset_id IS NULL)::INT      AS missing
              FROM media_asset a
              JOIN credentials c
                ON c.userid = a.userid
               AND c.entity IN ('facebook_page', 'whatsapp_business')
              LEFT JOIN media_handle h
                ON h.asset_id = a.id
               AND h.account_id = c.key;

          # ACCESS PATH: a bounded span on media_handle@media_handle_expires_at_idx —
          # `(/NULL - /<now + margin>]`. Verified with EXPLAIN. Note the OPEN lower
          # bound: `expires_at IS NOT NULL` is what makes CockroachDB exclude the NULL
          # prefix from the span, so rows with no recorded expiry are not even read.
          # Drop that predicate and the scan starts reading them.
          #
          # THIS IS THE ONLY QUERY HERE WHOSE COST DOES NOT GROW WITH THE TABLE. It
          # reads only the handles at or near expiry, which in a healthy system is a
          # near-empty span regardless of how many handles exist. Both alerting metrics
          # are deliberately served from it, so the alerting path never degrades as the
          # media library grows. Keep it that way — do not add a column to this query
          # that is not in the (expires_at) index, because that turns the span into an
          # index join and then a full scan.
          - query_name: media_handle_expiry
            query: |
              SELECT
                COUNT(*) FILTER (WHERE expires_at <  now())::INT AS expired,
                COUNT(*) FILTER (WHERE expires_at >= now())::INT AS expiring
              FROM media_handle
              WHERE expires_at IS NOT NULL
                AND expires_at < now() + INTERVAL '{{ .Values.media.refreshMarginHours }} hours';

          # ACCESS PATH: FULL SCAN of media_handle@media_handle_pkey, and it cannot be
          # made cheaper — platform_media_id is in no secondary index, so counting NULLs
          # means reading every row. Stated rather than hidden.
          #
          # Both metrics from this query are DENOMINATORS AND EXPLANATIONS, never alert
          # inputs, which is what makes the scan acceptable: if it ever becomes too
          # expensive the honest fix is to drop the interval on this one query, and no
          # alert loses resolution. For scale: the study_traffic collector beside this
          # one scans a 1,000,000-row table every 60s in 420-500ms. media_handle is
          # assets x accounts; it would have to become genuinely large to compete.
          #
          # If it does, the remedy is a partial index — `INDEX (asset_id) WHERE
          # platform_media_id IS NULL` in a new migration — NOT a rewrite here. Not
          # shipped in migration 24 on purpose: an index sized for a table with zero
          # rows is a guess.
          - query_name: media_handle_inventory
            query: |
              SELECT
                COUNT(*)::INT                                             AS handles,
                COUNT(*) FILTER (WHERE platform_media_id IS NULL)::INT    AS dead
              FROM media_handle;

          # ACCESS PATH: scan of media_asset@(userid, content_hash) — CockroachDB picks
          # the narrowest covering index for a bare COUNT(*), not the primary index.
          - query_name: media_assets
            query: |
              SELECT COUNT(*)::INT AS assets FROM media_asset;
