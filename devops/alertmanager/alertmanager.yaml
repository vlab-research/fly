# LIVE AlertManager config — Slack-only, two-channel severity routing.
# This is what is DEPLOYED (base config in the `alertmanager` secret, monitoring
# namespace; the prometheus-operator regenerates the mounted `...-generated`
# secret from it and AlertManager hot-reloads).
#
#   severity=critical      -> #vlab-alerts-critical   (e.g. KubeProxyDown, our *page* rules)
#   severity=warning/info  -> #vlab-alerts            (default; info is normally
#                             inhibited — see inhibit_rules below)
#   Watchdog               -> silenced (null receiver; no dead-man's-switch yet)
#   InfoInhibitor          -> silenced (plumbing for the inhibit_rules, not an alert)
#   KubeJobFailed          -> silenced (fires on ANY single failed Job; replaced
#   KubeJobNotCompleted       by our CronJobRepeatedlyFailing / CronJobNotSucceeding
#                             rules in the vlab-alerts chart, which alert only on
#                             REPEATED failure. Rules stay in Prometheus for debugging.)
#
# Webhooks are injected at apply time from a gitignored secret.env by apply.sh —
# NEVER commit real hooks.slack.com URLs. To add real paging later (ntfy /
# Telegram), see README.md and alertmanager-full.yaml.example.
global:
  resolve_timeout: 5m
route:
  receiver: 'slack-warning'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [ 'alertname="Watchdog"' ]
      receiver: 'null'
    # InfoInhibitor is PLUMBING, not an alert. kube-prometheus-stack fires it
    # (severity=none) purely so the inhibit_rule below has something to key on;
    # its own annotations say as much. The stock config null-routes it. Ours
    # didn't, so with `severity=none` it fell through to the default receiver and
    # posted to #vlab-alerts — 49 firing episodes in the 4 days to 2026-08-04.
    - matchers: [ 'alertname="InfoInhibitor"' ]
      receiver: 'null'
    # Default kube-prometheus-stack job alerts: replaced by the vlab-alerts
    # cronjob-health rules (repeated-failure only). Kept in Prometheus, muted here.
    - matchers: [ 'alertname=~"KubeJobFailed|KubeJobNotCompleted"' ]
      receiver: 'null'
    - matchers: [ 'severity="critical"' ]
      receiver: 'slack-critical'
      group_wait: 30s
      repeat_interval: 4h
# The stock kube-prometheus-stack inhibit rules (the fourth part of the stock set
# is the InfoInhibitor null route, up in `routes`). This config replaced the
# operator-generated default wholesale and dropped them, which is what made
# #vlab-alerts a firehose: CPUThrottlingHigh (info, chronic on kminion and the
# vstag redis replica) is meant to be inhibited and instead flapped through 202
# firing episodes in the 4 days to 2026-08-04 — 65% of ALL alert activity.
#
# Deliberately NOT null-routing severity=info outright: the third rule's design is
# that an info alert stays visible when a warning/critical is firing in the same
# namespace (that is when InfoInhibitor stops firing), which is exactly when it
# carries diagnostic value. Muting info unconditionally would throw that away.
inhibit_rules:
  - source_matchers: [ 'severity="critical"' ]
    target_matchers: [ 'severity=~"warning|info"' ]
    equal: ['namespace', 'alertname']
  - source_matchers: [ 'severity="warning"' ]
    target_matchers: [ 'severity="info"' ]
    equal: ['namespace', 'alertname']
  - source_matchers: [ 'alertname="InfoInhibitor"' ]
    target_matchers: [ 'severity="info"' ]
    equal: ['namespace']
receivers:
  - name: 'null'
  - name: 'slack-warning'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_WARNING}'
        channel: '#vlab-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}⚠️{{ else }}✅{{ end }} [{{ .CommonLabels.severity }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ .Annotations.message }}{{ .Annotations.description }}\n{{ end }}"
  - name: 'slack-critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_CRITICAL}'
        channel: '#vlab-alerts-critical'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [CRITICAL] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ .Annotations.message }}{{ .Annotations.description }}\n{{ end }}"
    # Phone push: criticals ALSO go to ntfy topic `vlab-alerts` (self-hosted,
    # ntfy.vlab.digital). ntfy INLINE templating (template=yes + URL-encoded Go
    # templates in t=/m=) formats the payload -> "🔴 FIRING: <alertname>" + per-alert
    # summaries; static priority=4 (high). (ntfy 2.11.0 has no built-in
    # `template=alertmanager`; that's a newer release.) Bearer token injected from
    # secret.env by apply.sh (never commit it). See devops/ntfy/README.md.
    webhook_configs:
      - url: 'https://ntfy.vlab.digital/vlab-alerts?template=yes&priority=4&t=%7B%7Bif%20eq%20.status%20%22firing%22%7D%7D%F0%9F%94%B4%20FIRING%7B%7Belse%7D%7D%E2%9C%85%20RESOLVED%7B%7Bend%7D%7D%3A%20%7B%7B.commonLabels.alertname%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bwith%20.annotations.summary%7D%7D%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.annotations.description%7D%7D%0A%7B%7B.%7D%7D%7B%7Bend%7D%7D%7B%7Bwith%20.annotations.message%7D%7D%0A%7B%7B.%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: '${NTFY_TOKEN}'
