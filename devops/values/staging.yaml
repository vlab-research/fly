  envFrom: *botenvs
  env:
    - name: FAKE
      value: 'nope'
    - name: TYPEFORM_URL
      value: 'https://api.typeform.com'
    - name: CUBEJS_API_SECRET
      value: 'notasecret'
    - name: CUBEJS_DB_TYPE
      value: 'postgres'
    - name: DB_DATABASE
      value: 'chatroach'
    - name: CUBEJS_DB_NAME
      value: 'chatroach'
    - name: DB_USER
      value: 'chatroach'
    - name: CUBEJS_DB_USER
      value: 'chatroach'
    - name: DB_PASSWORD
      value: ''
    - name: CUBEJS_DB_PASS
      value: ''
    - name: DB_HOST
      value: *host
    - name: CUBEJS_DB_HOST
      value: *host
    - name: DB_PORT
      value: '26257'
    - name: CUBEJS_DB_PORT
      value: '26257'
    - name: FORMCENTRAL_URL
      value: 'http://gbv-formcentral'
    - name: TYPEFORM_REDIRECT_URL
      value: 'https://staging--vlab-research.netlify.app/surveys/auth'
    - name: FACEBOOK_GRAPH_URL
      value: 'https://graph.facebook.com/v25.0'
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_EXPORTS_TOPIC
      value: *exportertopic
    - name: EXODUS_API_URL
      value: "http://gbv-exodus-api"
    # Platform notices proxy (/platform/notices). Unset -> endpoint returns
    # { notices: [] } (feature cleanly off).
    - name: ALERTMANAGER_URL
      value: 'http://alertmanager-operated.monitoring:9093'

    # ---- Media object storage (planning/media-abstraction.md §4.7) ----------
    # The dashboard is the only WRITER of media objects. Credentials are NOT
    # here — see the `dashboard-media` secret, applied from the gitignored
    # dashboard-server/.env-media-staging by devops/secrets.sh.
    - name: STORAGE_BACKEND
      value: 's3'
    - name: MEDIA_BUCKET
      # SEPARATE BUCKET FROM PRODUCTION, mirroring the existing exports split
      # (`fly` vs `staging`, documentation/exports-storage.md). §4.7 names only
      # `media` and does not address staging at all; sharing one bucket would
      # mean a staging deploy holds Delete on production media objects, and
      # staging test uploads would become permanent objects served from
      # media.vlab.digital. Provisioned by devops/minio/media-svcacct.sh staging.
      value: 'media-staging'
    - name: MEDIA_PREFIX
      value: 'a/'
    - name: MEDIA_PUBLIC_BASE
      # Must match media-proxy.ingress.host below. The dashboard mints asset
      # URLs from this and that Ingress answers them; a mismatch does not error,
      # it produces URLs that resolve to nothing.
      value: 'https://staging.media.vlab.digital'
    - name: S3_ENDPOINT
      value: 'http://minio.minio.svc.cluster.local:9000'
    - name: S3_REGION
      value: 'us-east-1'
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dashboard-media
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dashboard-media
          key: S3_SECRET_ACCESS_KEY

  resources:
    requests:
      cpu: 10m
      memory: 64Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    hosts:
      - host: staging.fly-dashboard-api.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix
    tls:
      - secretName: gbv-dashboard-cert
        hosts:
          - staging.fly-dashboard-api.vlab.digital

  service:
    type: ClusterIP
    port: 80


# botserver is fully replaced by hermes on staging. Disabled via the
# botserver.enabled condition (default true in the umbrella chart for prod), so
# its Deployment, Service, and Ingress are removed; every internal /synthetic
# caller now targets http://gbv-hermes. Rollback: set enabled: true here and
# hermes.enabled: false, and restore the BOTSERVER_URL values to gbv-botserver.
botserver:
  enabled: false

# Hermes — Rust webhook ingester that fully replaces botserver on staging. It is
# the single ingestion service: external Messenger /webhooks + WhatsApp
# /whatsapp on the public host, and internal /synthetic for replybot/dean/
# dinersclub — all publishing raw source-tagged events to the chat topic. Gated
# by hermes.enabled (false by default in the umbrella chart) so it never renders
# in production while carrying the -wa staging image.
hermes:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/vlab-research/hermes
    tag: *vhermes
    pullPolicy: Always

  envFrom: *botenvs

  env:
    - name: BOTSERVER_EVENT_TOPIC
      value: *topic
    - name: KAFKA_BROKERS
      value: *kb
    - name: PORT
      value: "80"
    - name: DASHBOARD_URL
      value: "http://gbv-dashboard"
    # Enables X-Hub-Signature-256 enforcement on POST /webhooks and
    # POST /whatsapp (hermes reads FB_APP_SECRET; the secret stores it as
    # FACEBOOK_APP_SECRET, hence the explicit mapping — envFrom alone won't
    # surface it under the name hermes expects).
    - name: FB_APP_SECRET
      valueFrom:
        secretKeyRef:
          name: gbv-bot-envs
          key: FACEBOOK_APP_SECRET
    # WHATSAPP_VERIFY_TOKEN comes from the gbv-bot-envs secret via envFrom
    # (same pattern as VERIFY_TOKEN). Until the key is added to the secret,
    # GET /whatsapp verification returns 401.
    #
    # THE 400 GATE for the /synthetic conversation triple (user, account_id,
    # platform) — see documentation/event-envelope.md and
    # planning/conversation-identity.md §7.3.1.
    #
    # "false": hermes accepts a synthetic POST that is missing account_id or
    # platform, stamps whatever it can derive, and logs the gap. "true": it
    # returns 400 and produces nothing.
    #
    # Staging is where this gets flipped to "true" FIRST, once every poster is
    # deployed here — that is the rehearsal for the production flip, and the
    # place a missed poster should be discovered. Declared explicitly rather
    # than left to hermes' default so the flip is an edit to this file plus a
    # rollout restart, never a `kubectl set env` against live state.
    #
    # There are SIX posters, not the four named in the plan. Grep the
    # BOTSERVER_URL values in this file to enumerate them:
    #   dean, dinersclub, message-worker, replybot  — shipped with the triple
    #   linksniffer, exodus                         — NOT YET COMPLIANT
    # See the production.yaml comment on this same variable for why linksniffer
    # cannot comply without a change to how replybot builds webview URLs.
    - name: SYNTHETIC_REQUIRE_CONVERSATION
      value: "false"

  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: staging.fly-botserver.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix
    tls:
      - secretName: gbv-botserver-cert
        hosts:
          - staging.fly-botserver.vlab.digital

  service:
    type: ClusterIP
    port: 80

# Configuration for Exporter Worker
exporter:
  replicaCount: 1
  image:
    repository: "ghcr.io/vlab-research/exporter"
    pullPolicy: Always
    tag: *vexporter
  env:
    - name: "APP_NAME"
      value: "exporter"
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_TOPIC
      value: *exportertopic
    - name: KAFKA_GROUP_ID
      value: "exporter-staging"
  envSecrets:
    - exporter

exodus:
  image:
    repository: ghcr.io/vlab-research/exodus
    tag: *vexodus
    pullPolicy: Always
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  - name: DRY_RUN
    value: "false"
  - name: EXODUS_RATE_LIMIT
    value: "1s"
  - name: EXODUS_MAX_BAIL_USERS
    value: "100000"
  executor:
    enabled: true
    schedule: "* * * * *"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  api:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

message-worker:
  replicaCount: 1
  image:
    repository: ghcr.io/vlab-research/message-worker
    tag: *vmessageworker
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  envFrom: *botenvs
  env:
  - name: KAFKA_BROKERS
    value: *kb
  - name: KAFKA_COMMAND_TOPIC
    value: *commandstopic
  - name: KAFKA_EVENT_TOPIC
    # NOT merely an output topic. message-worker PRODUCES DIRECTLY to the chat
    # topic, bypassing hermes: its WhatsApp send echo — the event that advances
    # RESPONDING -> QOUT on a platform with no native echo webhook — is written
    # here by message-worker/kafka.go. So `chat-events` has more than one
    # producer, and message-worker stamps the account_id/platform envelope
    # itself. See message-worker/README.md and documentation/event-envelope.md.
    value: *topic
  - name: STRICT_EVENT_ENVELOPE
    # The producer-side envelope gate, and the counterpart to
    # SYNTHETIC_REQUIRE_CONVERSATION above: that one guards events entering the
    # topic through hermes, this one guards events message-worker writes to it
    # directly.
    #
    #   "false"       -> log CHAT_EVENTS_ENVELOPE_MISSING at Error, publish anyway
    #   "true" (here) -> refuse to publish an event lacking account_id/platform
    #
    # STAGING IS WHERE THIS GETS TURNED ON FIRST, and this is the right place for
    # it: refusing drops the WhatsApp send echo, and on WhatsApp that echo is the
    # only thing that advances the conversation — so a stall here is a test
    # failure, while the same stall in production is a participant left hanging
    # mid-survey.
    #
    # NOT YET APPLIED as of this commit. Committing the value is half the change;
    # it takes effect on
    #   helm upgrade gbv vlab -f devops/values/staging.yaml -n vstag
    #   kubectl rollout restart deployment/gbv-message-worker -n vstag
    #
    # Turned on deliberately for the account_id migration: a silent envelope
    # omission that merely logs is one nobody chases, and the whole point of the
    # migration window is to surface producer bugs immediately, while there is
    # someone watching. A stalled staging survey is exactly the loud failure we
    # want.
    #
    # PRODUCTION STAYS "false" until CHAT_EVENTS_ENVELOPE_MISSING reads zero here
    # for 24h. Then flip production.yaml — as its own reviewed diff.
    #
    # Declared explicitly rather than left to config.go's default so turning it
    # on is a reviewable committed diff plus a rollout restart — never a
    # `kubectl set env` against live state.
    value: "true"
  - name: KAFKA_GROUP_ID
    # Env-scoped: the Kafka cluster is shared with production. Mirrors the
    # vlab-<env>-* topic convention. See documentation/kafka-consumer-lag-alerting.md
    value: "vlab-staging-message-worker"
  - name: KAFKA_AUTO_OFFSET_RESET
    value: "latest"
  - name: DATABASE_URL
    value: "postgresql://chatroach@gbv-cockroachdb-public:26257/chatroach?sslmode=disable"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes"
  - name: FACEBOOK_GRAPH_URL
    value: "https://graph.facebook.com/v25.0"
  - name: NUM_WORKERS
    # Burrow's worker count for this pod. Pool-wide as of burrow v0.2.0; it was
    # briefly per-partition in v0.1.6.
    #
    # 48, raised from 8, to hold concurrency where v0.1.6 put it. Staging runs
    # replicaCount: 1 against a 6-partition commands topic, so it owned all six:
    #
    #   v0.1.5   8 per pod                       =  8 in flight
    #   v0.1.6   8 per partition x 6 partitions  = 48 in flight
    #   v0.2.0   48 per pod                      = 48 in flight
    #
    # One pod at 48 workers over 6 partitions is a genuine test of the v0.2.0
    # dispatch: many keys, one shared worker set, and the pool-wide bound
    # (QueueSizePerWorker x NUM_WORKERS) exercised on a single node.
    #
    # See documentation/message-worker-deployment.md §Scaling.
    value: "48"
  - name: MAX_RETRY_ATTEMPTS
    value: "3"
  - name: INITIAL_BACKOFF_MS
    value: "100"
  - name: MAX_BACKOFF_MS
    value: "1000"

  # ---- Media handle layer (planning/media-abstraction.md §8.5, §9.2) --------
  # When off, the worker never queries media_handle: legacy attachment_id
  # passthrough, everything else by URL. Every message under this flag has a URL
  # fallback beneath it (§13), so rollback is this line back to "false" plus a
  # helm upgrade, with no state to unwind.
  - name: MEDIA_HANDLE_USE
    value: "true"

# media-proxy — the sole public read path for media assets (§4.4). See the
# production block for why >=2 replicas and a PDB are requirements (§13).
#
# Staging keeps the same replica floor deliberately. The temptation is one pod,
# since staging traffic is trivial — but a single-replica staging is then not a
# rehearsal of production, and this is the service whose failure mode (media
# sends with no handle fail) is the one worth rehearsing.
media-proxy:
  enabled: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  image:
    repository: ghcr.io/vlab-research/media-proxy
    tag: *vmediaproxy
    pullPolicy: Always

  # Chart-managed, like every other application ingress in this umbrella. Must
  # match MEDIA_PUBLIC_BASE above: the dashboard mints asset URLs from that and
  # this is what answers them. A mismatch does not error — it produces URLs that
  # resolve to nothing, and the first symptom is a broken image.
  ingress:
    enabled: true
    className: nginx
    clusterIssuer: letsencrypt-prod
    host: staging.media.vlab.digital

  # From media-proxy/.env-media-staging via devops/secrets.sh.
  envFrom: media-proxy

  env:
    - name: S3_ENDPOINT
      value: 'http://minio.minio.svc.cluster.local:9000'
    - name: S3_REGION
      value: 'us-east-1'
    - name: MEDIA_BUCKET
      # Must match the dashboard's MEDIA_BUCKET above — staging's own bucket.
      value: 'media-staging'
    - name: MEDIA_PREFIX
      value: 'a/'
    - name: PORT
      value: '8080'

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

# ---- Media handle reconciler (§7, §11.3) ------------------------------------
# A standalone script (dashboard-server/scripts/media-reconcile.js) run as a
# CronJob from the dashboard image — see production.yaml for the fuller notes.
#
# Offset half an hour from production so the two never contend on the same MinIO
# at the same minute.
#
# The per-run bound is deliberately tighter here: a bug in a job whose unit of
# work is "upload a file to Meta" is cheaper to find against a 20-action cap
# than a 200-action one. Blast radius, not capacity — anything over the cap is
# deferred to the next tick and named in the log, so it costs latency, never
# coverage.
mediaReconciler:
  enabled: true
  schedule: "47 * * * *"
  refreshMargin: "72h"
  maxActions: 20
  maxBytes: 134217728 # 128 MiB
  prune: "on"
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# ###########################################################################
# THE PHASE 1.5 BACKFILL JOB, ON STAGING (planning/backfill-in-cluster-job.md)
#
# This is a REHEARSAL OF THE DELIVERY MECHANISM, not of the backfill. vstag was
# backfilled for real on 2026-08-24 and its remaining 8,791 NULL rows are the
# permanently-unattributable synthetic ones, so this Job walks ~9 batches and
# commits ZERO updates. That is the intent: every UPDATE is a no-op by way of
# `AND account_id IS NULL`, and what is under test is everything around it --
# that the image pulls from ghcr, that the root DSN connects from inside the
# cluster, that --sql-dir and --yes are right, that the cursor table is both
# readable and writable by the Job, and that the loop reaches END and records
# `done`.
#
# It therefore proves NOTHING about duration, disk churn or the write path
# itself. vstag's rows are ~25x fatter than production's and it runs a single
# CockroachDB node. Re-measure on production; inherit nothing.
#
# RUN AND VERIFIED 2026-08-26 (helm revision 87, Job succeeded in 108s):
# 9 batches, 0 rows updated, reached END -- and chatroach.messages was unchanged
# afterwards at 162,691 / 153,900 / 8,791, exactly as before. The cursor row it
# left behind (9 batches, done=t) is the proof that the Job wrote to
# chatroach.backfill_cursor as root from inside the cluster.
#
# Turned back off: this is one-shot, and a completed one-shot should not stay
# armed. Re-enabling would now exit immediately with ALREADY DONE anyway.
# ###########################################################################
messagesBackfill:
  enabled: false
  image:
    repository: ghcr.io/vlab-research/backfill
    tag: v0.1.0
    pullPolicy: IfNotPresent
  batchSize: 20000
  maxBatches: 20000
  statementTimeout: "10m"
  cursorKey: "messages-account-backfill"
  backoffLimit: 3
  activeDeadlineSeconds: ~
  extraArgs: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

cockroachdb:
  image:
    tag: v24.1.28
  statefulset:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        # cache + max-sql-memory + Go runtime + Pebble overhead must fit in here.
        # It previously did NOT: cache 250MiB + max-sql-memory 250MiB was exactly
        # the 500Mi request, leaving nothing for anything else.
        memory: 2Gi
      limits:
        memory: 3Gi
    budget:
      maxUnavailable: 0
  conf:
    cache: 256MiB
    # RAISED 2026-08-22, from 250MiB.
    #
    # NOT because it fixed migration 26 -- it did not. That failure was
    # `bulkio.index_backfill.batch_size` (50000 rows x 35 KB of `content`) and
    # recurred unchanged at 1GiB, the allocation growing to fill whatever pool it
    # was given. See 26-messages-account.sql. This comment previously claimed
    # otherwise and was wrong.
    #
    # Raised because the old configuration was incoherent on its own terms:
    # cache 250MiB + max-sql-memory 250MiB was EXACTLY the 500Mi request, leaving
    # nothing for the Go runtime or Pebble. That is an OOMKill waiting for load,
    # independent of any migration. Production runs 3000Mi (production.yaml);
    # staging was the outlier.
    max-sql-memory: 1GiB
    max-disk-temp-storage: 4GiB
  tls:
    enabled: no
  storage:
    persistentVolume:
      # PENDING RESIZE TO 20Gi -- deliberately still 5Gi here. See
      # devops/resize-statefulset-pvc.sh.
      #
      # This number and the live StatefulSet must change TOGETHER. A StatefulSet's
      # volumeClaimTemplates are immutable, so raising it here on its own makes every
      # `helm upgrade` of this release fail hard, for every service in it:
      #   The StatefulSet "gbv-cockroachdb" is invalid: spec: Forbidden: updates to
      #   statefulset spec for fields other than 'replicas', 'ordinals', 'template', ...
      # (verified with `kubectl apply --dry-run=server`, 2026-08-23). So the bump to
      # 20Gi belongs in the SAME change as the resize run, never ahead of it.
      #
      # WHY 20Gi IS WANTED. 5Gi is 87% full (4.2G used, 688M free on 2026-08-23) and
      # could not absorb the conversation-identity backfill: `messages` has no column
      # families, so writing account_id rewrites the whole row -- `content` included --
      # into every index, and that MVCC churn is held for gc.ttlseconds. Making room
      # meant dropping both surviving index canaries, i.e. a schema decision forced by
      # disk. 20Gi is sized for the operation needing the most room -- rebuilding a
      # content-storing index needs a full second copy of the table (~22.1 GB logical /
      # ~4.2 GB physical), and that rebuild is now the only rollback path.
      size: 5Gi
      storageClass: "pd-ssd"

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.2.1-debian-12-r0
  architecture: replication
  auth:
    enabled: true
    sentinel: false
  master:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.76.0-debian-12-r0
    serviceMonitor:
      enabled: true
      interval: 30s
  networkPolicy:
    enabled: true
    allowExternal: false
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
