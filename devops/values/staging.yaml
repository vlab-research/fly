tags:
  kafka: false
  backup: false
  cockroach: true
  redis: true
  naughtybot: false
  botscribe: false
  scratchbot: false
  scribble: true
  dean: true

kafkabrokers: &kb "kafka-headless.default.svc.cluster.local:29092"
chatTopic: &topic "vlab-staging-chat-events"
stateTopic: &statetopic "vlab-staging-state"
responseTopic: &responsetopic "vlab-staging-response"
paymentTopic: &paymenttopic "vlab-staging-payment"
botEnvs: &botenvs gbv-bot-envs
chatbaseHost: &host "gbv-cockroachdb-public"
exporterTopic: &exportertopic "vlab-staging-exports"
chatLogTopic: &chatlogtopic "vlab-staging-chat-log"
commandsTopic: &commandstopic "vlab-staging-commands"

versionDashboard: &vdashboard v0.0.72
versionBotserver: &vbotserver v0.0.12
# Off the -wa scheme as of v0.0.5, following dean's precedent in 7c6658ff: the
# suffix guards WhatsApp work from reaching production, and WhatsApp is in
# production now, so the guard had become noise on this service.
versionHermes: &vhermes v0.0.5
# THE CONVERSATION-IDENTITY ROLLOUT. Every bump in this block is the same commit
# (ad112fa0, PR #149 merged into `staging`) and they deploy TOGETHER -- a
# conversation is (platform, account_id, user_id), and the services disagree about
# what a conversation IS until all of them are on it.
#
# v0.0.221 is v0.0.219 plus conversation-identity: the state cache keyed by the
# triple, the account-scoped replay, and the merged WhatsApp entry gate -- main's
# percent-escape alphabet AND the branch's position-independent `form.` pair, both
# of which are needed to stop a CTWA arrival misrouting to FALLBACK_FORM.
#
# Production stays on v0.0.219 until this soaks 24h. See
# planning/conversation-identity.md §5.
versionReplybot: &vreplybot v0.0.224
versionLinksniffer: &vlinksniffer v0.0.9
versionDean: &vdean v0.0.47
versionScribble: &vscribble v0.0.34
# v0.0.46 is the first image that reads DINERSCLUB_PROVIDER_TIMEOUT and exposes
# /metrics. v0.0.45 was cut from bc0ec780 (2026-08-01), which PREDATES the
# timeout work -- so the image and these values move together, never separately:
# on the old image the metrics Service would point at a port nothing binds.
versionDinersclub: &vdinersclub v0.0.49
versionFormcentral: &vformcentral v0.0.14-wa
versionExporter: &vexporter v0.6.12
versionExodus: &vexodus v0.2.5
versionMessageWorker: &vmessageworker v0.1.27
# Released and running: `media-proxy-v0.0.1` was cut on 2026-08-10 and
# gbv-media-proxy has been 2/2 in vstag since. The former warning here ("this tag
# does not exist in ghcr.io yet") is retired.
versionMediaProxy: &vmediaproxy v0.0.1

# Kafka consumer-group lag/health alerting is NOT defined here — it lives at the
# infra level (one rule set for the shared cluster, covering both envs) in
# devops/kafka-consumer-health/, deployed once into the monitoring namespace.

kafkaTopics:
  - name: *topic
    partitions: 8
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *statetopic
    partitions: 2
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *responsetopic
    partitions: 2
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *paymenttopic
    partitions: 2
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *exportertopic
    partitions: 2
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *chatlogtopic
    partitions: 12
    replicationFactor: 1
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *commandstopic
    partitions: 6
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days



dinersclub:
  replicaCount: 1
  image:
    repository: ghcr.io/vlab-research/dinersclub
    tag: *vdinersclub
    pullPolicy: Always
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  envFrom: gbv-bot-envs
  env:
    - name: CACHE_TTL
      value: "1h"
    - name: CACHE_NUM_COUNTERS
      value: "1000"
    - name: CACHE_MAX_COST
      value: "1000"
    - name: CACHE_BUFFER_ITEMS
      value: "64"
    - name: RELOADLY_SANDBOX
      value: "false"
    - name: BOTSERVER_URL
      value: "http://gbv-hermes/synthetic"
    - name: CHATBASE_DATABASE
      value: "chatroach"
    - name: CHATBASE_HOST
      value: *host
    - name: CHATBASE_PORT
      value: "26257"
    - name: CHATBASE_USER
      value: "chatroach"
    - name: CHATBASE_MAX_CONNECTIONS
      value: "1"
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_POLL_TIMEOUT
      value: "10s"
    - name: KAFKA_TOPIC
      value: *paymenttopic
    - name: KAFKA_GROUP
      value: "dinersclub"
    - name: DINERSCLUB_BATCH_SIZE
      value: "1"
    # Keep in step with production -- see the budget comment there. spine's
    # 300s max.poll.interval.ms is the same in both environments.
    - name: DINERSCLUB_RETRY_BOTSERVER
      value: "60s"
    - name: DINERSCLUB_RETRY_PROVIDER
      value: "60s"
    - name: DINERSCLUB_PROVIDER_TIMEOUT
      value: "15s"
    # Must match dinersclub.metrics.port below.
    - name: DINERSCLUB_METRICS_PORT
      value: "9090"
    - name: DINERSCLUB_POOL_SIZE
      value: "1"
    - name: DINERSCLUB_PROVIDERS
      value: "fake,reloadly,giftcard,http,dingconnect"

  # Prometheus scrape target. dinersclub is the first application service here
  # that Prometheus scrapes, and these metrics are not optional colour: since
  # dinersclub/classify.go, a transient or precondition payment failure sends
  # no event and so leaves no row for sql_exporter to find. An empty
  # researcher wallet is invisible everywhere else. Turning this off makes the
  # withheld failures unaccountable and blinds the PaymentWalletEmpty alert in
  # devops/alerts/templates/payment-health.yaml.
  metrics:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true

dean:
  image:
    repository: ghcr.io/vlab-research/dean
    tag: *vdean
    pullPolicy: Always
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  - name: DEAN_ERROR_TAGS
    value: "NETWORK,INTERNAL,STATE_ACTIONS"
  - name: DEAN_ERROR_INTERVAL
    value: "48 hours"
  # WhatsApp rate-limit / throttling codes, added 2026-09-03 (131056) and
  # 2026-09-04 (the rest). All are transient by definition. The send fails,
  # replybot marks the participant BLOCKED with a null next_retry, and without
  # an entry here nothing ever resumes them. Unlike the FIELD_NOT_FOUND case
  # noted above, none of these can be permanent, so they cannot burn
  # DEAN_RETRY_MAX_ATTEMPTS against something that can never succeed. The
  # blocked sweep runs inside the `respondings` CronJob below, every 30 min.
  #
  #      4  App-level Graph API throttle, "Application request limit reached".
  #  80007  WhatsApp Business Account rate limit. Companion to 80006, already here.
  # 130429  Cloud API message throughput exceeded -- our own send rate, not a
  #         property of the recipient, so it can strand many participants at once.
  # 131048  Spam rate limit: sending restricted because previous messages were
  #         blocked or flagged. Lifts when quality recovers. Retrying costs
  #         nothing extra -- a restricted send never reaches a recipient, so it
  #         cannot itself be flagged -- and picks the participant back up when
  #         the restriction clears.
  # 131056  (Business Account, Consumer Account) pair rate limit: WhatsApp
  #         throttling one business number to one consumer number. Seen in
  #         production on the LAC Healthy Diets pilot; cleared in a few minutes.
  # 131057  Business Account in maintenance mode, e.g. a throughput upgrade.
  #
  # Deliberately NOT here: 133016 (registration attempt limit -- applies to
  # registering a number, never to a send), and 368 / 131031 / 130497, which are
  # policy restrictions rather than throttles and are not self-clearing.
  - name: DEAN_FB_CODES
    value: "2022,613,-1,190,80006,551,4,80007,130429,131048,131056,131057"
  - name: DEAN_BLOCKED_INTERVAL
    value: "48 hours"
  - name: DEAN_RESPONDING_INTERVAL
    value: "48 hours"
  - name: DEAN_RESPONDING_GRACE
    value: "20 minutes"
  - name: DEAN_RETRY_MAX_ATTEMPTS
    value: "30"
  - name: DEAN_PAYMENT_GRACE
    value: "2 hours"
  - name: DEAN_PAYMENT_INTERVAL
    value: "14 days"
  - name: DEAN_PAYMENT_MAX_ATTEMPTS
    value: "30"
  - name: DEAN_TIMEOUT_MAX_ATTEMPTS
    value: "5"
  - name: DEAN_SEND_DELAY
    value: "3s"
  - name: DEAN_FOLLOWUP_MIN
    value: "12 hours"
  - name: DEAN_FOLLOWUP_MAX
    value: "24 hours"
  - name: DEAN_TIMEOUT_BLACKLIST
    value: "bebborsbaseserb,bebbobg2basebul,nciaim2followup2pay,nciaim2followup1pay,nciaim2baselinepay"
  - name: DEAN_TIMEOUT_MAX_PAST
    value: "72 hours"
  - name: DEAN_SPAMMER_EXTERNAL_EVENTS_MAX
    value: "100"
  queries:
    - name: respondings
      queries: "respondings,blocked,errored"
      schedule: "*/30 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: followups
      queries: "followups"
      schedule: "0 5-19 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: timeouts
      queries: "timeouts"
      schedule: "*/10 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: payments
      queries: "payments"
      schedule: "0 */6 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: spammers
      queries: "spammers"
      schedule: "30 3 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi

scribble:
  image:
    # ghcr, not docker.io/vlabresearch: .github/workflows/release.yml publishes
    # every service to ghcr.io/vlab-research/<image>. The old docker.io repo has
    # no tag past v0.0.32, so any newer tag here is an ImagePullBackOff.
    repository: ghcr.io/vlab-research/scribble
    tag: *vscribble
    pullPolicy: Always
  resources:
    requests:
      cpu: 40m
      memory: 64Mi
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: KAFKA_BROKERS
    value: *kb
  - name: KAFKA_POLL_TIMEOUT
    value: "2s"
  - name: SCRIBBLE_ERROR_HANDLERS
    value: ""

  sinks:
    - destination: "states"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *statetopic
      - name: KAFKA_GROUP
        value: "scribble-states"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "128"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"
    - destination: "responses"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *responsetopic
      - name: KAFKA_GROUP
        value: "scribble-responses"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "64"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"
    - destination: "messages"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *topic
      - name: KAFKA_GROUP
        value: "scribble-messages"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "true"
    - destination: "chat-log"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *chatlogtopic
      - name: KAFKA_GROUP
        value: "scribble-chat-log"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"


