  - name: FALLBACK_FORM
    value: "305"
  - name: REPLYBOT_EVENT_TOPIC
    value: *topic
  - name: REPLYBOT_RESET_SHORTCODE
    value: "reset"
  - name: KAFKA_BROKERS
