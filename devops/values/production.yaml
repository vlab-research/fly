# NOTE ON THE -wa SUFFIX. documentation/staging-tagging-and-deploy.md says a
# -wa tag must never appear in this file, because the suffix is the guardrail
# against promoting untested WhatsApp work. That rule was DELIBERATELY suspended
# for the previous promotion: those were the exact images validated in vstag, and
# re-cutting clean tags would have shipped different bytes than were tested. The
# note said to swap to clean tags on the next release and restore the rule.
#
# RULE RESTORED FOR REPLYBOT (2026-07-29, VIR-17/VIR-19). The quick-reply
# referral hotfix is a real code change, so there is no "same bytes as tested"
# argument to preserve -- it was cut as a clean tag, replybot-v0.0.212.
#
# RULE RESTORED FOR DASHBOARD (2026-07-29). Same reasoning: the study-health
# taxonomy divergence fixes are a real code change, cut clean as
# dashboard-v0.0.69; dashboard-v0.0.70 continues on clean tags.
#
# The remaining services below still carry -wa and were out of scope for both
# changes; swap each to a clean tag as it next changes.
versionDashboard: &vdashboard v0.0.72
versionBotserver: &vbotserver v0.0.12
# v0.0.3-wa -> v0.0.5: carries 36808aa5 "feat(envelope): every event carries
# platform and account_id" -- the PRODUCER side of the conversation-identity
# rollout. Without it production gets the schema and the consumers but nothing
# stamps the triple, so CONVERSATION_TUPLE_MISSING is non-zero by construction
# and new rows keep landing with NULL account_id (which would make 1.5 a
# backfill racing its own writer). v0.0.5 is a clean descendant of v0.0.3-wa,
# so the WhatsApp work is retained -- and it drops the -wa suffix, as the note
# above asks. vstag has run v0.0.5 since 2026-08-23 with all 5.3 gates at zero.
# v0.0.7: Kafka producer linger 1000ms -> 5ms.
versionHermes: &vhermes v0.0.7
# ############################################################################
# MUST be >= v0.0.221 -- this file no longer sets CHATBASE_BACKEND.
#
# v0.0.219 does `require(process.env.CHATBASE_BACKEND)` at
# lib/spine-supervisor/spine-supervisor.js:14, i.e. on the CORE conversation
# path. Commit b5a4b99d dropped that env var from this file for the new
# replybot but left the version at v0.0.219, so applying that state would make
# require(undefined) throw ERR_INVALID_ARG_TYPE and CRASH-LOOP replybot --
# stopping conversations, not merely degrading them.
#
# v0.0.221 absorbs the client into lib/chatbase and requires it directly; it has
# no runtime read of the env var. vstag has run v0.0.221 without CHATBASE_BACKEND
# since the staging rollout. Caught before applying, 2026-08-25.
#
# If you ever need to roll replybot back below v0.0.221, you MUST restore
# CHATBASE_BACKEND=@vlab-research/chatbase-postgres to replybot.env here.
# ############################################################################
# v0.0.223: Kafka producer linger 1000ms -> 10ms.
# v0.0.224: resolves the WhatsApp choice-list button label from the form's
#   Messages (borrowed key block.dropdown.hint) into question metadata.
#   Pairs with message-worker v0.1.25 -- neither half does anything alone.
versionReplybot: &vreplybot v0.0.224
# Bumped v0.0.6 -> v0.0.9 together with the repository move below: ghcr holds
# only v0.0.8/v0.0.9, so the registry change CANNOT ship without the version
# change or the pull 404s. Behaviour change to announce: an *invalid*
# vlab_platform now returns 400 instead of coercing to messenger. Absent is
# still assumed messenger.
versionLinksniffer: &vlinksniffer v0.0.9
# v0.0.45 -> v0.0.47: carries 36808aa5, the envelope. dean is a SYNTHETIC
# PRODUCER (timeout events). An unstamped synthetic event triggers
# assume-messenger, which is silently correct on Messenger and BLOCKS the
# conversation on WhatsApp -- see versionDinersclub below for the incident.
versionDean: &vdean v0.0.47
# ############################################################################
# DO NOT APPLY THIS VALUE BEFORE MIGRATION 28a HAS COMPLETED.
#
# v0.0.33 is where scribble/response.go switched to the 4-column
#   ON CONFLICT (userid, pageid, timestamp, question_ref)
# and v0.0.34 carries it too. Against production's CURRENT 3-column responses
# primary key that raises 42P10, and scribble.go treats any write error as
# log.Fatalf -- so applying this early crash-loops gbv-scribble-responses.
#
# Correct order: 28a -> apply this -> verify -> 28b.
# See devops/migrations/28a-responses-account-scoped-key.sql.
#
# Bumped v0.0.32 -> v0.0.34 together with the repository move below; ghcr holds
# only v0.0.34, so the registry change cannot ship without the version change.
# ############################################################################
versionScribble: &vscribble v0.0.34
# v0.0.46 is the first image that reads DINERSCLUB_PROVIDER_TIMEOUT and exposes
# /metrics. v0.0.45 was cut from bc0ec780 (2026-08-01), which PREDATES the
# timeout work -- so the image and the env block below move together, never
# separately: on the old image the metrics Service points at a port nothing
# binds, and DINERSCLUB_PROVIDER_TIMEOUT is an unknown variable it ignores.
#
# The v0.0.45..v0.0.46 range is payment-recovery work only (classify.go,
# metrics.go, the bounded provider client). dingconnect.go is untouched, so the
# Generic Secrets concern that held dinersclub at v0.0.43-wa in PR #147 does
# not apply here -- and dingconnect was not in DINERSCLUB_PROVIDERS at the time
# of that bump. (It is now, as of 2026-09-02; see the env block below.)
# v0.0.46 -> v0.0.48: carries 36808aa5, the envelope.
#
# WHY THIS IS NOT OPTIONAL -- reproduced on production 2026-08-25. dinersclub is
# the payment synthetic producer. At v0.0.46 it emits payment:reloadly with the
# LEGACY shape -- {"user":..., "page":...} -- carrying no platform. For a
# WhatsApp participant that unstamped event triggers assume-messenger, so the
# token lookup runs against entity 'facebook_page' for a whatsapp_business
# account, finds no row, and the conversation goes BLOCKED:
#
#   platform API error (status 0): failed to get token: token not found for
#   platform account: 1203867182815254 (db error: no rows in result set)
#
# The credential is present and correct; only the lookup entity is wrong. This
# is exactly the W1 hazard in planning/multi-platform-plan.md: assume-messenger
# is correct ONLY while Messenger is the only live transport. It passes on
# Messenger and fails on WhatsApp, so a Messenger-only test cannot catch it.
# v0.0.48 -> v0.0.49: carries VIR-40 -- dingconnect payments are configured by
# DELIVERED amount + tolerance, not by an authored (sku_code, send_value) pair,
# with the resolution moved into go-dingconnect v0.3.0.
#
# Nothing in this rollout is required by an existing study: every payment block
# in production today names sku_code/send_value, and that form is unchanged and
# still resolves without touching the catalogue. The new path activates only for
# a block that declares `amount`. So this is safe to roll ahead of the LAC
# instrument that needs it, and carries no migration for anyone else.
#
# It also pins RateLimited as PERMANENT in classify.go. That was previously
# reaching the unknown-code default, which happened to be the same answer -- the
# layers agreed by accident. dinersclub never consults the client library's
# Retryable(), which calls RateLimited retryable; retrying it re-sends to a
# number that may have tripped a per-account fraud rule.
versionDinersclub: &vdinersclub v0.0.49
versionFormcentral: &vformcentral v0.0.14-wa
versionExporter: &vexporter v0.6.12
# v0.2.3 -> v0.2.5: carries e2bdfae8 "fix(scribble,exodus): stop discarding a
# second account's rows" -- multi-account specific, so it only manifests once a
# participant exists on two accounts. Part of the same rollout stack.
versionExodus: &vexodus v0.2.5
# v0.1.19 -> v0.1.21: same reason as versionHermes above -- both carry
# 36808aa5, the producer-side envelope. Clean descendant. vstag has run v0.1.21
# since 2026-08-23, zero CHAT_EVENTS_ENVELOPE_MISSING.
# v0.1.21 -> v0.1.22: token lookup failures are no longer classified as
# platform errors. At v0.1.21 they were wrapped in &PlatformError{StatusCode:0},
# tagged FB, and turned into BLOCKED -- which dean cannot retry, because its
# Blocked query keys on fb_error_code and a lookup miss has none. A production
# conversation was stranded permanently on 2026-08-25. They now fall through to
# STATE_ACTIONS -> ERROR, which dean's Errored query retries with backoff.
# v0.1.23: bounds the synthetic POST to botserver, which had no timeout.
# v0.1.24: WhatsApp list rows carry the option text as a row description,
#   recovered from the question body. WhatsApp-only -- the Messenger
#   translator is untouched, and the WhatsApp path is still dormant here.
# v0.1.25: renders that list button from replybot's metadata, falling back to
#   "Choose". Pairs with replybot v0.0.224.
versionMessageWorker: &vmessageworker v0.1.25
versionMediaProxy: &vmediaproxy v0.0.1
# One-shot, not a service: the Phase 1.5 messages backfill
# (planning/backfill-in-cluster-job.md). Kept here anyway so its image is
# pinned and reviewable exactly like every other image this file deploys.
versionBackfill: &vbackfill v0.1.0

# Kafka consumer-group lag/health alerting is NOT defined here anymore. The
# Kafka cluster, Prometheus and kminion are singletons shared by prod+staging,
# so their alerting is a single infra-level rule set deployed once into the
# monitoring namespace. See devops/kafka-consumer-health/ (Helm release
# 'kafka-consumer-health'). The old laggingAlerts/processingAlerts values and
# their vlab umbrella templates have been retired.

