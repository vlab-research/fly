tags:
  kafka: false
  backup: true
  cockroach: true
  redis: true
  naughtybot: false
  botscribe: false
  scratchbot: false
  scribble: true
  dean: true

kafkabrokers: &kb "kafka-headless.default.svc.cluster.local:29092"
chatTopic: &topic "vlab-prod-chat-events"
stateTopic: &statetopic "vlab-prod-state"
responseTopic: &responsetopic "vlab-prod-response"
paymentTopic: &paymenttopic "vlab-prod-payment"
botEnvs: &botenvs gbv-bot-envs
chatbaseHost: &host "gbv-cockroachdb-public"
exporterTopic: &exportertopic "vlab-exports"
chatLogTopic: &chatlogtopic "vlab-prod-chat-log"
commandsTopic: &commandstopic "vlab-prod-commands"

# NOTE ON THE -wa SUFFIX. documentation/staging-tagging-and-deploy.md says a
# -wa tag must never appear in this file, because the suffix is the guardrail
# against promoting untested WhatsApp work. That rule was DELIBERATELY suspended
# for the previous promotion: those were the exact images validated in vstag, and
# re-cutting clean tags would have shipped different bytes than were tested. The
# note said to swap to clean tags on the next release and restore the rule.
#
# RULE RESTORED FOR REPLYBOT (2026-07-29, VIR-17/VIR-19). The quick-reply
# referral hotfix is a real code change, so there is no "same bytes as tested"
# argument to preserve -- it was cut as a clean tag, replybot-v0.0.212.
#
# RULE RESTORED FOR DASHBOARD (2026-07-29). Same reasoning: the study-health
# taxonomy divergence fixes are a real code change, cut clean as
# dashboard-v0.0.69; dashboard-v0.0.70 continues on clean tags.
#
# The remaining services below still carry -wa and were out of scope for both
# changes; swap each to a clean tag as it next changes.
versionDashboard: &vdashboard v0.0.72
versionBotserver: &vbotserver v0.0.12
versionHermes: &vhermes v0.0.3-wa
versionReplybot: &vreplybot v0.0.218
versionLinksniffer: &vlinksniffer v0.0.6
versionDean: &vdean v0.0.45
versionScribble: &vscribble v0.0.32
# v0.0.46 is the first image that reads DINERSCLUB_PROVIDER_TIMEOUT and exposes
# /metrics. v0.0.45 was cut from bc0ec780 (2026-08-01), which PREDATES the
# timeout work -- so the image and the env block below move together, never
# separately: on the old image the metrics Service points at a port nothing
# binds, and DINERSCLUB_PROVIDER_TIMEOUT is an unknown variable it ignores.
#
# The v0.0.45..v0.0.46 range is payment-recovery work only (classify.go,
# metrics.go, the bounded provider client). dingconnect.go is untouched, so the
# Generic Secrets concern that held dinersclub at v0.0.43-wa in PR #147 does
# not apply here -- and dingconnect is not in DINERSCLUB_PROVIDERS anyway.
versionDinersclub: &vdinersclub v0.0.46
versionFormcentral: &vformcentral v0.0.14-wa
versionExporter: &vexporter v0.6.10
versionExodus: &vexodus v0.2.3
versionMessageWorker: &vmessageworker v0.1.19
versionMediaProxy: &vmediaproxy v0.0.1

# Kafka consumer-group lag/health alerting is NOT defined here anymore. The
# Kafka cluster, Prometheus and kminion are singletons shared by prod+staging,
# so their alerting is a single infra-level rule set deployed once into the
# monitoring namespace. See devops/kafka-consumer-health/ (Helm release
# 'kafka-consumer-health'). The old laggingAlerts/processingAlerts values and
# their vlab umbrella templates have been retired.

kafkaTopics:
  - name: *topic
    partitions: 48
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *statetopic
    partitions: 12
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *responsetopic
    partitions: 12
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *paymenttopic
    partitions: 2
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *exportertopic
    partitions: 2
    replicationFactor: 2
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *chatlogtopic
    partitions: 12
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days
  - name: *commandstopic
    partitions: 6
    replicationFactor: 3
    config:
      "retention.ms": "2678400000" # 31 days


dinersclub:
  replicaCount: 1
  image:
    repository: ghcr.io/vlab-research/dinersclub
    tag: *vdinersclub
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  envFrom: gbv-bot-envs
  env:
    - name: CACHE_TTL
      value: "1h"
    - name: CACHE_NUM_COUNTERS
      value: "1000"
    - name: CACHE_MAX_COST
      value: "1000"
    - name: CACHE_BUFFER_ITEMS
      value: "64"
    - name: RELOADLY_SANDBOX
      value: "false"
    - name: BOTSERVER_URL
      value: "http://gbv-hermes/synthetic"
    - name: CHATBASE_DATABASE
      value: "chatroach"
    - name: CHATBASE_HOST
      value: *host
    - name: CHATBASE_PORT
      value: "26257"
    - name: CHATBASE_USER
      value: "chatroach"
    - name: CHATBASE_MAX_CONNECTIONS
      value: "1"
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_POLL_TIMEOUT
      value: "10s"
    - name: KAFKA_TOPIC
      value: *paymenttopic
    - name: KAFKA_GROUP
      value: "dinersclub"
    - name: DINERSCLUB_BATCH_SIZE
      value: "2"
    # THESE THREE ARE A BUDGET, NOT INDEPENDENT KNOBS. spine hardcodes
    # max.poll.interval.ms=300s; if one batch outruns that, Kafka evicts the
    # group, the uncommitted batch is redelivered, and dinersclub crash-loops
    # on it forever making zero progress. That happened on 2026-08-17 with the
    # old 2m/2m values and no provider timeout at all.
    #
    # Worst case for a batch (POOL_SIZE == BATCH_SIZE, so messages run
    # concurrently and the batch costs about what one message costs):
    #   auth on cache miss     <=  15s  (1 provider call)
    #   Payout backoff         <=  60s elapsed + 45s last attempt
    #   sendResult backoff     <=  60s elapsed + one in-cluster hermes call
    #   -------------------------------------------------------------
    #   ~180s, leaving headroom under the 300s eviction deadline.
    #
    # ONE ATTEMPT IS THREE CALLS, NOT ONE. Reloadly's DoJob makes FindOperator
    # + Topup, and AutoFallback can add a second Topup on a refusal -- so an
    # attempt costs up to 3x PROVIDER_TIMEOUT (45s), which is why the per-call
    # ceiling has to be so much smaller than the budget that contains it.
    #
    # The retry budget now applies to declined payments, not just to system
    # faults: since dinersclub/classify.go, a provider error code classified
    # `transient` is retried inside this budget instead of being handed
    # straight to the respondent as a failure. 60s buys ~2 real attempts.
    #
    # Raising any of these, or BATCH_SIZE above POOL_SIZE, must be re-checked
    # against that 300s ceiling.
    #
    # CORRECTION to the note this replaces, which had it backwards. That note
    # said the v0.0.45 image "reads these" and that "the code shipped and its
    # config did not". The opposite is true: dinersclub-v0.0.45 points at
    # bc0ec780 (2026-08-01), which PREDATES commit 19692c1b (2026-08-17) --
    # the tag was cut before the timeout work existed. So neither half shipped.
    # v0.0.45 has no bounded provider client at all and ignores
    # DINERSCLUB_PROVIDER_TIMEOUT as an unknown variable.
    #
    # That is why the image and these values are ONE deploy, not two. Applying
    # this file to v0.0.45 would set a per-call ceiling nothing reads, and
    # point the new metrics Service at a port that binary does not listen on --
    # which would page DinersClubMetricsMissing for a healthy pod.
    - name: DINERSCLUB_RETRY_BOTSERVER
      value: "60s"
    - name: DINERSCLUB_RETRY_PROVIDER
      value: "60s"
    # Hard ceiling on ONE outbound provider HTTP call. RETRY_PROVIDER cannot do
    # this job: backoff only checks elapsed time between attempts, so a single
    # hung call is unbounded without this.
    - name: DINERSCLUB_PROVIDER_TIMEOUT
      value: "15s"
    - name: DINERSCLUB_POOL_SIZE
      value: "2"
    - name: DINERSCLUB_PROVIDERS
      value: "fake,reloadly,giftcard,http"
    # Must match dinersclub.metrics.port below -- the Service targets the
    # container port by name, but the process binds whatever this says.
    - name: DINERSCLUB_METRICS_PORT
      value: "9090"

  # Prometheus scrape target. dinersclub is the first application service here
  # that Prometheus scrapes, and these metrics are not optional colour: since
  # dinersclub/classify.go, a transient or precondition payment failure sends
  # no event and so leaves no row for sql_exporter to find. An empty
  # researcher wallet is invisible everywhere else. Turning this off makes the
  # withheld failures unaccountable and blinds the PaymentWalletEmpty alert in
  # devops/alerts/templates/payment-health.yaml.
  metrics:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true

dean:
  image:
    repository: ghcr.io/vlab-research/dean
    tag: *vdean
    pullPolicy: IfNotPresent
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  # FIELD_NOT_FOUND was temporarily added here on 2026-07-29 and removed on
  # 2026-07-30, once the VIR-18 recovery it was needed for had run (40 of 54
  # stranded participants replayed back into their surveys).
  #
  # Do not re-add it as a standing entry. FIELD_NOT_FOUND is usually a permanent
  # error -- a survey editor deleting a field produces it too -- so as a
  # retryable tag it burns DEAN_RETRY_MAX_ATTEMPTS (60) attempts per state
  # forever with no possibility of success. It was only worth enabling because
  # a deploy had made a whole cohort's errors retroactively transient.
  #
  # If you ever need it again, note the trap that cost us the most time: adding
  # the tag ALONE does nothing. Replybot serves state from a Redis cache and
  # only replays the event log on a cache MISS, and updateState() rewrites the
  # key with a fresh 24h TTL on every processed event. So retrying reads the
  # same corrupt state, re-errors, and keeps the bad entry alive indefinitely --
  # a sweep of 40 participants recovered exactly zero. You must clear the cached
  # state first (devops/clear-state-cache.sh), then let the retry fire.
  - name: DEAN_ERROR_TAGS
    value: "NETWORK,INTERNAL,STATE_ACTIONS"
  - name: DEAN_ERROR_INTERVAL
    value: "48 hours"
  - name: DEAN_FB_CODES
    value: "2022,613,-1,190,80006,551"
  - name: DEAN_BLOCKED_INTERVAL
    value: "120 hours"
  - name: DEAN_RESPONDING_INTERVAL
    value: "48 hours"
  - name: DEAN_RESPONDING_GRACE
    value: "20 minutes"
  - name: DEAN_RETRY_MAX_ATTEMPTS
    value: "60"
  - name: DEAN_PAYMENT_GRACE
    value: "2 hours"
  - name: DEAN_PAYMENT_INTERVAL
    value: "14 days"
  - name: DEAN_PAYMENT_MAX_ATTEMPTS
    value: "30"
  - name: DEAN_TIMEOUT_MAX_ATTEMPTS
    value: "5"
  - name: DEAN_SEND_DELAY
    value: "3s"
  - name: DEAN_FOLLOWUP_MIN
    value: "12 hours"
  - name: DEAN_FOLLOWUP_MAX
    value: "24 hours"
  - name: DEAN_TIMEOUT_BLACKLIST
    value: "bebborsbaseserb,bebbobg2basebul,nciaim2followup2pay,nciaim2followup1pay,nciaim2baselinepay"
  - name: DEAN_TIMEOUT_MAX_PAST
    value: "72 hours"
  - name: DEAN_SPAMMER_EXTERNAL_EVENTS_MAX
    value: "100"
  queries:
    - name: respondings
      queries: "respondings,blocked,errored"
      schedule: "*/30 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: followups
      queries: "followups"
      schedule: "0 5-19 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: timeouts
      queries: "timeouts"
      schedule: "*/10 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: payments
      queries: "payments"
      schedule: "0 */6 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: spammers
      queries: "spammers"
      schedule: "30 3 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi

scribble:
  image:
    repository: vlabresearch/scribble
    tag: *vscribble
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: KAFKA_BROKERS
    value: *kb
  - name: KAFKA_POLL_TIMEOUT
    value: "2s"
  - name: SCRIBBLE_ERROR_HANDLERS
    value: ""

  sinks:
    - destination: "states"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *statetopic
      - name: KAFKA_GROUP
        value: "scribble-states"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "128"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"
    - destination: "responses"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *responsetopic
      - name: KAFKA_GROUP
        value: "scribble-responses"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "64"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"
    - destination: "messages"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *topic
      - name: KAFKA_GROUP
        value: "scribble-messages"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "true"
    - destination: "chat-log"
      replicaCount: 1
      env:
      - name: KAFKA_TOPIC
        value: *chatlogtopic
      - name: KAFKA_GROUP
        value: "scribble-chat-log"
      - name: SCRIBBLE_CHUNK_SIZE
        value: "32"
      - name: SCRIBBLE_BATCH_SIZE
        value: "128"
      - name: SCRIBBLE_STRICT_MODE
        value: "false"

# dumper: RETIRED 2026-07-21. The legacy `cockroach dump` → GCS CronJob is
