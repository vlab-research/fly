# Hermes — the Rust webhook ingester that replaces botserver in this release.
# Serves GET/POST /webhooks (Messenger), GET/POST /whatsapp (WhatsApp Cloud
# API), POST /synthetic (internal) and GET /health.
#
# It reuses botserver's host AND cert secret deliberately, so Meta's webhook
# callback URL does not change and cert-manager does not re-issue. Because
# nginx will not admit two Ingresses claiming the same host, botserver.enabled
# must go false in the SAME apply that brings hermes up — expect a brief
# ingest gap while the Ingress changes hands.
hermes:
  enabled: true
  replicaCount: 3

  image:
    # Chart default is vlabresearch/hermes, which does not exist on Docker Hub
    # at all (404 on the repository, not just the tag). This override is
    # mandatory, not cosmetic.
    repository: ghcr.io/vlab-research/hermes
    tag: *vhermes
    pullPolicy: IfNotPresent

  envFrom: *botenvs

  env:
    - name: BOTSERVER_EVENT_TOPIC
      value: *topic
    - name: KAFKA_BROKERS
      value: *kb
    - name: PORT
      value: "80"
    - name: DASHBOARD_URL
      value: "http://gbv-dashboard"
    # Enables X-Hub-Signature-256 enforcement on POST /webhooks and
    # POST /whatsapp (hermes reads FB_APP_SECRET; the secret stores it as
    # FACEBOOK_APP_SECRET, hence the explicit mapping — envFrom alone won't
    # surface it under the name hermes expects). Omitting this silently
    # DISABLES signature enforcement with no error.
    - name: FB_APP_SECRET
      valueFrom:
        secretKeyRef:
          name: gbv-bot-envs
          key: FACEBOOK_APP_SECRET
    # WHATSAPP_VERIFY_TOKEN comes from the gbv-bot-envs secret via envFrom.
    # It is NOT yet present in the vprod secret — GET /whatsapp verification
    # returns 401 until it is added. Messenger ingest is unaffected.
    #
    # THE 400 GATE for the /synthetic conversation triple (user, account_id,
    # platform) — see documentation/event-envelope.md and
    # planning/conversation-identity.md §7.3.1.
    #
    # "false": hermes accepts a synthetic POST that is missing account_id or
    # platform, stamps whatever it can derive, and logs the gap. "true": it
    # returns 400 and produces nothing.
    #
    # This MUST stay "false" until every synthetic poster is deployed with the
    # triple AND the canary has read zero missing components for 24h. Flipping
    # it early 400s in-flight posters mid-rollout — message-worker posts a
    # machine_report on every send failure and replybot on every report, so the
    # blast radius is the whole error-reporting path, not an edge case.
    #
    # There are SIX posters, not the four named in the plan. Grep the
    # BOTSERVER_URL values in this file to enumerate them:
    #   dean, dinersclub, message-worker, replybot  — shipped with the triple
    #   linksniffer, exodus                         — NOT YET COMPLIANT
    #
    # linksniffer (linksniffer/eventer.go) cannot currently comply at all: its
    # `id` and `pageid` come from researcher-authored query params in each
    # survey's webview `url` object (documentation/questions.md "Links"), and
    # there is no platform param and no place to put one without threading the
    # conversation into replybot's translateWebview/makeUrl. exodus
    # (exodus/sender/sender.go) can comply — `states.platform` exists — but its
    # UserTarget carries no Platform field yet.
    #
    # Flipping this to "true" before both are fixed silently kills every tracked
    # link click (linksniffer:click waits stop resolving) and every bail.
    #
    # It is declared here explicitly, rather than left to hermes' default, so
    # step 4 of the rollout is a one-line edit to this file plus a rollout
    # restart — never a `kubectl set env` against live state.
    - name: SYNTHETIC_REQUIRE_CONVERSATION
      value: "false"

  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: fly-botserver.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix
    tls:
      - secretName: fly-botserver-cert
        hosts:
          - fly-botserver.vlab.digital

  service:
    type: ClusterIP
    port: 80


