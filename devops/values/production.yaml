  # not deleted, so rollback is a one-line flip back to `enabled: true` plus
  # reverting the six BOTSERVER_URL values to http://gbv-botserver.
  # NOTE: the image below is Docker Hub, which CI no longer publishes to. It
  # resolves today only because v0.0.12 already exists there. Any future
  # botserver bump needs a ghcr.io repository override first.
  enabled: false

  replicaCount: 3

  image:
    repository: vlabresearch/botserver
    tag: *vbotserver
    pullPolicy: IfNotPresent

  envFrom: *botenvs

  env:
  - name: BOTSERVER_EVENT_TOPIC
    value: *topic
  - name: KAFKA_BROKERS
    value: *kb
  - name: PORT
    value: "80"
  - name: DASHBOARD_URL
    value: "http://gbv-dashboard"

  resources:
    requests:
      cpu: 5m
      memory: 48Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: fly-botserver.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix

    tls:
      - secretName: fly-botserver-cert
        hosts:
          - fly-botserver.vlab.digital

  service:
    type: ClusterIP
    port: 80


# Hermes — the Rust webhook ingester that replaces botserver in this release.
# Serves GET/POST /webhooks (Messenger), GET/POST /whatsapp (WhatsApp Cloud
# API), POST /synthetic (internal) and GET /health.
#
# It reuses botserver's host AND cert secret deliberately, so Meta's webhook
# callback URL does not change and cert-manager does not re-issue. Because
# nginx will not admit two Ingresses claiming the same host, botserver.enabled
# must go false in the SAME apply that brings hermes up — expect a brief
# ingest gap while the Ingress changes hands.
hermes:
  enabled: true
  replicaCount: 3

  image:
    # Chart default is vlabresearch/hermes, which does not exist on Docker Hub
    # at all (404 on the repository, not just the tag). This override is
    # mandatory, not cosmetic.
    repository: ghcr.io/vlab-research/hermes
    tag: *vhermes
    pullPolicy: IfNotPresent

  envFrom: *botenvs

  env:
    - name: BOTSERVER_EVENT_TOPIC
      value: *topic
    - name: KAFKA_BROKERS
      value: *kb
    - name: PORT
      value: "80"
    - name: DASHBOARD_URL
      value: "http://gbv-dashboard"
    # Enables X-Hub-Signature-256 enforcement on POST /webhooks and
    # POST /whatsapp (hermes reads FB_APP_SECRET; the secret stores it as
    # FACEBOOK_APP_SECRET, hence the explicit mapping — envFrom alone won't
    # surface it under the name hermes expects). Omitting this silently
    # DISABLES signature enforcement with no error.
    - name: FB_APP_SECRET
      valueFrom:
        secretKeyRef:
          name: gbv-bot-envs
          key: FACEBOOK_APP_SECRET
    # WHATSAPP_VERIFY_TOKEN comes from the gbv-bot-envs secret via envFrom.
    # It is NOT yet present in the vprod secret — GET /whatsapp verification
    # returns 401 until it is added. Messenger ingest is unaffected.

  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: fly-botserver.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix
    tls:
      - secretName: fly-botserver-cert
        hosts:
          - fly-botserver.vlab.digital

  service:
    type: ClusterIP
    port: 80


# Configuration for Exporter Worker
exporter:
  replicaCount: 2
  image:
    repository: "ghcr.io/vlab-research/exporter"
    pullPolicy: Always
    tag: *vexporter
  env:
    - name: "APP_NAME"
      value: "exporter"
  envSecrets:
    - exporter

exodus:
  image:
    repository: ghcr.io/vlab-research/exodus
    tag: *vexodus
    pullPolicy: IfNotPresent
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  - name: DRY_RUN
    value: "false"
  - name: EXODUS_RATE_LIMIT
    value: "1s"
  - name: EXODUS_MAX_BAIL_USERS
    value: "100000"
  executor:
    enabled: true
    schedule: "* * * * *"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  api:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

message-worker:
  # replybot v0.0.210-wa has NO send path of its own — it publishes commands
  # here — so a worker at 0 replicas means production sends nothing at all,
  # silently. That is why this is 2 and not 1: the second pod is REDUNDANCY,
  # not throughput. A node failure, eviction or crashloop must never leave
  # production with zero senders. Do not lower this to save a pod.
  #
  # Throughput comes from NUM_WORKERS (8, see below), not from replicas.
  # Sending is IO-bound — the pod waits on graph.facebook.com, it does not
  # compute — so capacity is concurrent in-flight HTTP calls. 2 x 8 = 16,
  # against a 7-day peak command rate of 6.3/sec. Observed CPU is ~6m of a
  # 500m limit. Raising NUM_WORKERS is the cheap lever if that ever changes;
  # more pods buy availability, not speed.
  #
  # Both levers preserve ordering as of burrow v0.1.5. Commands are keyed by
  # user_id (replybot/lib/index.js), so a user sits on one partition, owned by
  # one pod; key-affinity dispatch then pins that user to one worker inside it.
  #
  # The useful ceiling is 6 (the partition count of vlab-prod-commands) — a 7th
  # pod would idle. This ran at 6 for three days after the incident below and
  # never used it.
  #
  # Background: planning/message-worker-command-lag.md (2026-08-17) — a bulk
  # utility-message campaign drove ~520 commands of lag and multi-minute
  # delivery delays for live surveys in other studies, because ONE serial
  # consumer (1 pod x 1 worker) drained a six-partition topic.
  replicaCount: 2
  image:
    repository: ghcr.io/vlab-research/message-worker
    tag: *vmessageworker
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  envFrom: *botenvs
  env:
  - name: KAFKA_BROKERS
    value: *kb
  - name: KAFKA_COMMAND_TOPIC
    value: *commandstopic
  - name: KAFKA_EVENT_TOPIC
    value: *topic
  - name: KAFKA_GROUP_ID
    # Env-scoped: the Kafka cluster is shared with staging. Mirrors the
    # vlab-<env>-* topic convention. See documentation/kafka-consumer-lag-alerting.md
    value: "vlab-prod-message-worker"
  - name: KAFKA_AUTO_OFFSET_RESET
    # Must stay "latest". vlab-prod-commands holds ~47k stale messages from an
    # abandoned trial; "earliest" would replay legacy `native` commands, which
    # worker.go rejects with a plain error -> burrow FatalOnError -> crashloop.
    value: "latest"
  - name: DATABASE_URL
    value: "postgresql://chatroach@gbv-cockroachdb-public:26257/chatroach?sslmode=disable"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes"
  - name: FACEBOOK_GRAPH_URL
    value: "https://graph.facebook.com/v25.0"
  - name: MESSENGER_URL
    value: "https://graph.facebook.com/v25.0"
  - name: WHATSAPP_GRAPH_URL
    # MUST be set explicitly. config.go defaults this to v18.0 independently of
    # FACEBOOK_GRAPH_URL above -- Meta has sunset v18.0, so leaving it unset
    # means every WhatsApp send fails while Messenger keeps working.
    value: "https://graph.facebook.com/v25.0"
  - name: NUM_WORKERS
    # The burrow pool's goroutine count (code default 100).
    #
    # Raising this was UNSAFE before burrow v0.1.5: dispatch went through one
    # shared channel with no key affinity, so N>1 let two commands for the SAME
    # user send concurrently and arrive out of order — a survey question before
    # its own preamble. v0.1.5 routes by hash(user_id) to a fixed worker, so
    # same-user commands stay FIFO while different users run in parallel, and
    # message-worker sets KeyAffinity unconditionally.
    #
    # 8 as of 2026-08-20, after smoke testing the concurrent path in vstag
    # (v0.1.19, NUM_WORKERS=8, sends delivered in order on one partition).
    # With 6 replicas that is 48-way outbound concurrency against a
    # 6-partition topic — far more headroom than the lag incident needed.
    #
    # Not higher, despite the code default of 100: per-worker queues are
    # JobQueueSize / NumWorkers, and burrow's poll loop is single-threaded, so
    # a backed-up worker stalls the whole pod's polling — including workers
    # sitting idle. See KEY_AFFINITY.md in the burrow repo. Raise only against
    # a measured send rate.
    value: "8"
  - name: MAX_RETRY_ATTEMPTS
    value: "3"
  - name: INITIAL_BACKOFF_MS
    value: "100"
  - name: MAX_BACKOFF_MS
    value: "1000"

  # ---- Media handle layer (planning/media-abstraction.md §8.5, §9.2) --------
  # When off, the worker never queries media_handle: legacy attachment_id
  # passthrough, everything else by URL. Every message under this flag has a URL
  # fallback beneath it (§13), so rollback is this line back to "false" plus a
  # rollout restart, with no state to unwind.
  #
  # Note there is no per-account gate — this is a single boolean read at worker
  # startup, so enablement is all-or-nothing for the namespace.
  - name: MEDIA_HANDLE_USE
    value: "true"

# media-proxy — the sole public read path for media assets (§4.4).
#
# ON THE CRITICAL PATH: if this is down, every media send with no cached
# platform handle fails (§13). Handle sends are unaffected, which is the
# strongest single argument for the handle layer existing — and the reason the
# replica floor and the PDB below are requirements, not hardening.
#
# It has NO DATABASE, deliberately (§4.4): Content-Type and Content-Disposition
# come from S3 object metadata written by dashboard-server at PutObject, so this
# service cannot be the thing that breaks when CockroachDB is slow.
media-proxy:
  enabled: true
  # >= 2 (§9.2, §13). Do not lower this to save a pod.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  image:
    repository: ghcr.io/vlab-research/media-proxy
    tag: *vmediaproxy
    pullPolicy: IfNotPresent

  # Chart-managed, like every other application ingress in this umbrella. Must
  # match MEDIA_PUBLIC_BASE above: the dashboard mints asset URLs from that and
  # this is what answers them. A mismatch does not error — it produces URLs that
  # resolve to nothing.
  #
  # DNS for this host must resolve to the nginx ingress LB BEFORE applying, or
  # cert-manager leaves a stuck ACME Order instead of failing visibly.
  ingress:
    enabled: true
    className: nginx
    clusterIssuer: letsencrypt-prod
    host: media.vlab.digital

  # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY, under exactly those names, from a
  # secret applied by devops/secrets.sh from the gitignored
  # media-proxy/.env-media-production. Read-only on media/* and without
  # s3:ListBucket — see media-proxy/.env-example for why.
  envFrom: media-proxy

  env:
    - name: S3_ENDPOINT
      value: 'http://minio.minio.svc.cluster.local:9000'
    - name: S3_REGION
      value: 'us-east-1'
    - name: MEDIA_BUCKET
      value: 'media'
    - name: MEDIA_PREFIX
      # Must equal the dashboard's MEDIA_PREFIX above. The proxy will not serve
      # any other prefix — that is the whole point of the path contract.
      value: 'a/'
    - name: PORT
      value: '8080'

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

# ---- Media handle reconciler (§7, §11.3) ------------------------------------
# A standalone script (dashboard-server/scripts/media-reconcile.js) run as a
# CronJob from the DASHBOARD image — devops/vlab/templates/media-reconciler-cronjob.yaml.
#
# The template lives in the umbrella chart, not the `dashboard` subchart, so it
# reuses .Values.dashboard.env / .envFrom verbatim. Restating the database host,
# S3 endpoint, bucket and keys would be a second copy that can silently
# disagree, and a reconciler pointed at the wrong bucket does not error — it
# finds no bytes and every send quietly falls back to URL.
#
# Requires migration 24, the `dashboard-media` secret, and a versionDashboard
# containing the script. Against an older tag the job exits with "Cannot find
# module" every hour.
mediaReconciler:
  enabled: true
  schedule: "17 * * * *"
  # Refresh once a handle is within this margin of expiry, so one the reconciler
  # has not reached yet degrades to a URL send rather than failing (§6). Must be
  # comfortably larger than the schedule interval. THE UNIT IS REQUIRED — a bare
  # "72" is refused at startup rather than read as 72 milliseconds.
  refreshMargin: "72h"
  # Per-run bound (§10). Desired state is assets x accounts and one production
  # user has 29 accounts, so a backfill burst is bounded two ways — count alone
  # is the wrong unit, since 200 actions is a few seconds of thumbnails or 20 GB
  # of documents. Whatever does not fit is deferred to the next tick and named
  # in the log.
  maxActions: 200
  maxBytes: 536870912 # 512 MiB
  prune: "on"
  activeDeadlineSeconds: 2400
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

cockroachdb:
  image:
    tag: v24.1.28
  statefulset:
    replicas: 4
    resources:
      requests:
        cpu: 200m
        memory: 8000Mi
    budget:
      maxUnavailable: 1
    serviceAccount:
      create: true
      annotations:
        iam.gke.io/gcp-service-account: cockroachdb-backup@toixotoixo.iam.gserviceaccount.com
  conf:
    cache: 3500Mi
    max-sql-memory: 3000Mi
    max-disk-temp-storage: 24GiB
  tls:
    enabled: no
  storage:
    persistentVolume:
      size: 240Gi
      storageClass: "pd-ssd"

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.2.1-debian-12-r0
  architecture: replication
  auth:
    enabled: true
    sentinel: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.76.0-debian-12-r0
    serviceMonitor:
      enabled: true
      interval: 30s
  networkPolicy:
    enabled: true
    allowExternal: false
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
