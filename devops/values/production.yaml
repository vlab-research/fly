# Hermes — the Rust webhook ingester that replaces botserver in this release.
# Serves GET/POST /webhooks (Messenger), GET/POST /whatsapp (WhatsApp Cloud
# API), POST /synthetic (internal) and GET /health.
#
# It reuses botserver's host AND cert secret deliberately, so Meta's webhook
# callback URL does not change and cert-manager does not re-issue. Because
# nginx will not admit two Ingresses claiming the same host, botserver.enabled
# must go false in the SAME apply that brings hermes up — expect a brief
# ingest gap while the Ingress changes hands.
hermes:
  enabled: true
  replicaCount: 3

  image:
    # Chart default is vlabresearch/hermes, which does not exist on Docker Hub
    # at all (404 on the repository, not just the tag). This override is
    # mandatory, not cosmetic.
    repository: ghcr.io/vlab-research/hermes
    tag: *vhermes
    pullPolicy: IfNotPresent

  envFrom: *botenvs

  env:
    - name: BOTSERVER_EVENT_TOPIC
      value: *topic
    - name: KAFKA_BROKERS
      value: *kb
    - name: PORT
      value: "80"
    - name: DASHBOARD_URL
      value: "http://gbv-dashboard"
    # Enables X-Hub-Signature-256 enforcement on POST /webhooks and
    # POST /whatsapp (hermes reads FB_APP_SECRET; the secret stores it as
    # FACEBOOK_APP_SECRET, hence the explicit mapping — envFrom alone won't
    # surface it under the name hermes expects). Omitting this silently
    # DISABLES signature enforcement with no error.
    - name: FB_APP_SECRET
      valueFrom:
        secretKeyRef:
          name: gbv-bot-envs
          key: FACEBOOK_APP_SECRET
    # WHATSAPP_VERIFY_TOKEN comes from the gbv-bot-envs secret via envFrom.
    # It is NOT yet present in the vprod secret — GET /whatsapp verification
    # returns 401 until it is added. Messenger ingest is unaffected.

  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: fly-botserver.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix
    tls:
      - secretName: fly-botserver-cert
        hosts:
          - fly-botserver.vlab.digital

  service:
    type: ClusterIP
    port: 80


# Configuration for Exporter Worker
exporter:
  replicaCount: 2
  image:
    repository: "ghcr.io/vlab-research/exporter"
    pullPolicy: Always
    tag: *vexporter
  env:
    - name: "APP_NAME"
      value: "exporter"
  envSecrets:
    - exporter

exodus:
  image:
    repository: ghcr.io/vlab-research/exodus
    tag: *vexodus
    pullPolicy: IfNotPresent
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  - name: DRY_RUN
    value: "false"
  - name: EXODUS_RATE_LIMIT
    value: "1s"
  - name: EXODUS_MAX_BAIL_USERS
    value: "100000"
  executor:
    enabled: true
    schedule: "* * * * *"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  api:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

message-worker:
  # Scaled up for the first time in this release. replybot v0.0.210-wa has NO
  # send path of its own — it publishes commands here — so a worker at 0
  # replicas means production sends nothing at all, silently.
  replicaCount: 1
  image:
    repository: ghcr.io/vlab-research/message-worker
    tag: *vmessageworker
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  envFrom: *botenvs
  env:
  - name: KAFKA_BROKERS
    value: *kb
  - name: KAFKA_COMMAND_TOPIC
    value: *commandstopic
  - name: KAFKA_EVENT_TOPIC
    value: *topic
  - name: KAFKA_GROUP_ID
    # Env-scoped: the Kafka cluster is shared with staging. Mirrors the
    # vlab-<env>-* topic convention. See documentation/kafka-consumer-lag-alerting.md
    value: "vlab-prod-message-worker"
  - name: KAFKA_AUTO_OFFSET_RESET
    # Must stay "latest". vlab-prod-commands holds ~47k stale messages from an
    # abandoned trial; "earliest" would replay legacy `native` commands, which
    # worker.go rejects with a plain error -> burrow FatalOnError -> crashloop.
    value: "latest"
  - name: DATABASE_URL
    value: "postgresql://chatroach@gbv-cockroachdb-public:26257/chatroach?sslmode=disable"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes"
  - name: FACEBOOK_GRAPH_URL
    value: "https://graph.facebook.com/v25.0"
  - name: MESSENGER_URL
    value: "https://graph.facebook.com/v25.0"
  - name: NUM_WORKERS
    value: "1"
  - name: MAX_RETRY_ATTEMPTS
    value: "3"
  - name: INITIAL_BACKOFF_MS
    value: "100"
  - name: MAX_BACKOFF_MS
    value: "1000"

cockroachdb:
  image:
    tag: v24.1.28
  statefulset:
    replicas: 4
    resources:
      requests:
        cpu: 200m
        memory: 8000Mi
    budget:
      maxUnavailable: 1
    serviceAccount:
      create: true
      annotations:
        iam.gke.io/gcp-service-account: cockroachdb-backup@toixotoixo.iam.gserviceaccount.com
  conf:
    cache: 3500Mi
    max-sql-memory: 3000Mi
    max-disk-temp-storage: 24GiB
  tls:
    enabled: no
  storage:
    persistentVolume:
      size: 240Gi
      storageClass: "pd-ssd"

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.2.1-debian-12-r0
  architecture: replication
  auth:
    enabled: true
    sentinel: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "pd-ssd"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.76.0-debian-12-r0
    serviceMonitor:
      enabled: true
      interval: 30s
  networkPolicy:
    enabled: true
    allowExternal: false
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true
