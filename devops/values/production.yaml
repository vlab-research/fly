    - name: DB_PORT
      value: '26257'
    - name: CUBEJS_DB_PORT
      value: '26257'
    - name: FORMCENTRAL_URL
      value: 'http://gbv-formcentral'
    - name: TYPEFORM_REDIRECT_URL
      value: 'https://fly.vlab.digital/surveys/auth'
    # v25.0, matching replybot and message-worker.
    #
    # Raised from v22.0 on 2026-07-26. It was briefly reverted that day while
    # investigating a message-template creation failure, but the version was
    # NOT the cause: creation failed identically on v22.0, then succeeded for
    # other pages under other users on the same version, and finally succeeded
    # on the original page once its Meta page-level permission was sorted.
    # Restored to v25.0 to confirm that conclusion holds.
    #
    # Caveat worth keeping: this is environment-coupled config. Staging runs a
    # different Facebook app, against different pages, with different granted
    # permissions -- so a green staging run is NOT evidence that a Graph
    # version change is safe here. If Meta permission errors ever appear on
    # template CRUD or utility sends, this line is a cheap thing to bisect.
    - name: FACEBOOK_GRAPH_URL
