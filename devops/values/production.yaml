    repository: ghcr.io/vlab-research/dean
    tag: *vdean
    pullPolicy: IfNotPresent
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  - name: DEAN_ERROR_TAGS
    value: "NETWORK,INTERNAL,STATE_ACTIONS"
  - name: DEAN_ERROR_INTERVAL
    value: "48 hours"
  - name: DEAN_FB_CODES
    value: "2022,613,-1,190,80006,551"
  - name: DEAN_BLOCKED_INTERVAL
    value: "120 hours"
  - name: DEAN_RESPONDING_INTERVAL
    value: "48 hours"
  - name: DEAN_RESPONDING_GRACE
    value: "20 minutes"
  - name: DEAN_RETRY_MAX_ATTEMPTS
    value: "60"
  - name: DEAN_PAYMENT_GRACE
    value: "2 hours"
  - name: DEAN_PAYMENT_INTERVAL
    value: "14 days"
  - name: DEAN_PAYMENT_MAX_ATTEMPTS
    value: "30"
  - name: DEAN_TIMEOUT_MAX_ATTEMPTS
    value: "5"
  - name: DEAN_SEND_DELAY
    value: "3s"
  - name: DEAN_FOLLOWUP_MIN
    value: "12 hours"
  - name: DEAN_FOLLOWUP_MAX
    value: "24 hours"
  - name: DEAN_TIMEOUT_BLACKLIST
    value: "bebborsbaseserb,bebbobg2basebul,nciaim2followup2pay,nciaim2followup1pay,nciaim2baselinepay"
  - name: DEAN_TIMEOUT_MAX_PAST
    value: "72 hours"
  - name: DEAN_SPAMMER_EXTERNAL_EVENTS_MAX
    value: "100"
  queries:
    - name: respondings
      queries: "respondings,blocked,errored"
      schedule: "*/30 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: followups
      queries: "followups"
      schedule: "0 5-19 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: timeouts
      queries: "timeouts"
      schedule: "*/10 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: payments
      queries: "payments"
      schedule: "0 */6 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: spammers
      queries: "spammers"
      schedule: "30 3 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi

scribble:
