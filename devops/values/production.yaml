linksniffer:
  replicaCount: 2

  image:
    repository: vlabresearch/linksniffer
    tag: *vlinksniffer
    pullPolicy: IfNotPresent

  env:
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"

  resources:
    requests:
      cpu: 5m
      memory: 10Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: links.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix

    tls:
      - secretName: gbv-linksniffer-cert
        hosts:
          - links.vlab.digital

  service:
    type: ClusterIP
    port: 80

dashboard:
  replicaCount: 3

  image:
    repository: ghcr.io/vlab-research/dashboard
    tag: *vdashboard
    pullPolicy: IfNotPresent

  envFrom: *botenvs
  env:
    - name: FAKE
      value: 'nope'
    - name: TYPEFORM_URL
      value: 'https://api.typeform.com'
    - name: CUBEJS_API_SECRET
      value: 'notasecret'
    - name: CUBEJS_DB_TYPE
      value: 'postgres'
    - name: DB_DATABASE
      value: 'chatroach'
    - name: CUBEJS_DB_NAME
      value: 'chatroach'
    - name: DB_USER
      value: 'chatroach'
    - name: CUBEJS_DB_USER
      value: 'chatroach'
    - name: DB_PASSWORD
      value: ''
    - name: CUBEJS_DB_PASS
      value: ''
    - name: DB_HOST
      value: *host
    - name: CUBEJS_DB_HOST
      value: *host
    - name: DB_PORT
      value: '26257'
    - name: CUBEJS_DB_PORT
      value: '26257'
    - name: FORMCENTRAL_URL
      value: 'http://gbv-formcentral'
    - name: TYPEFORM_REDIRECT_URL
      value: 'https://fly.vlab.digital/surveys/auth'
    # v25.0, matching replybot and message-worker.
    #
    # Raised from v22.0 on 2026-07-26. It was briefly reverted that day while
    # investigating a message-template creation failure, but the version was
    # NOT the cause: creation failed identically on v22.0, then succeeded for
    # other pages under other users on the same version, and finally succeeded
    # on the original page once its Meta page-level permission was sorted.
    # Restored to v25.0 to confirm that conclusion holds.
    #
    # Caveat worth keeping: this is environment-coupled config. Staging runs a
    # different Facebook app, against different pages, with different granted
    # permissions -- so a green staging run is NOT evidence that a Graph
    # version change is safe here. If Meta permission errors ever appear on
    # template CRUD or utility sends, this line is a cheap thing to bisect.
    - name: FACEBOOK_GRAPH_URL
      value: 'https://graph.facebook.com/v25.0'
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_EXPORTS_TOPIC
      value: *exportertopic
    - name: EXODUS_API_URL
      value: "http://gbv-exodus-api"
    - name: LINEAR_TEAM_ID
      value: '004fb90f-35c7-47dd-afd1-0bc5c71bed67'
    - name: LINEAR_TODO_STATE_ID
      value: 'ebc049cd-ca61-4ef2-a117-250bd08873f9'
    # Platform notices proxy (/platform/notices). Unset -> endpoint returns
    # { notices: [] } (feature cleanly off).
    - name: ALERTMANAGER_URL
      value: 'http://alertmanager-operated.monitoring:9093'

    # ---- Media object storage (planning/media-abstraction.md §4.7) -----------
  # The two S3 credentials are NOT here and must never be: they live in the
  # `dashboard-media` secret, applied by devops/secrets.sh from the gitignored
  # dashboard-server/.env-media-production. Scoped to media/* — not the root
  # credential, and unable to reach the exports bucket, which holds respondent
  # data.
    - name: STORAGE_BACKEND
      value: 's3'
    - name: MEDIA_BUCKET
      value: 'media'
    - name: MEDIA_PREFIX
      # Must match media-proxy's MEDIA_PREFIX and its path regex. config/index.js
      # throws at boot on any other value rather than silently writing objects
      # the proxy can never serve.
      value: 'a/'
    - name: MEDIA_PUBLIC_BASE
      # The origin a researcher pastes into a survey. A SEPARATE ORIGIN from
      # fly.vlab.digital by design (§4.6), so an uploaded HTML/SVG has no
      # dashboard session to reach. Must match media-proxy.ingress.host below —
      # a mismatch does not error, it mints URLs that resolve to nothing.
      value: 'https://media.vlab.digital'
    - name: S3_ENDPOINT
      # In-cluster and plaintext, on purpose: the write path has no reason to
      # leave the cluster, and routing it through storage-api.vlab.digital would
      # put nginx, cert-manager and the public internet on the upload path for
      # no gain.
      value: 'http://minio.minio.svc.cluster.local:9000'
    - name: S3_REGION
      # MinIO ignores it; the S3 protocol requires one.
      value: 'us-east-1'
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dashboard-media
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dashboard-media
          key: S3_SECRET_ACCESS_KEY

  resources:
    requests:
      cpu: 10m
      memory: 80Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    hosts:
      - host: fly-dashboard-api.vlab.digital
        paths:
          - path: '/'
            pathType: Prefix

    tls:
      - secretName: fly-dashboard-cert
        hosts:
          - fly-dashboard-api.vlab.digital

  service:
    type: ClusterIP
    port: 80


