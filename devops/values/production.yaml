dinersclub:
  replicaCount: 1
  image:
    repository: ghcr.io/vlab-research/dinersclub
    tag: *vdinersclub
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  envFrom: gbv-bot-envs
  env:
    - name: CACHE_TTL
      value: "1h"
    - name: CACHE_NUM_COUNTERS
      value: "1000"
    - name: CACHE_MAX_COST
      value: "1000"
    - name: CACHE_BUFFER_ITEMS
      value: "64"
    - name: RELOADLY_SANDBOX
      value: "false"
    - name: BOTSERVER_URL
      value: "http://gbv-hermes/synthetic"
    - name: CHATBASE_DATABASE
      value: "chatroach"
    - name: CHATBASE_HOST
      value: *host
    - name: CHATBASE_PORT
      value: "26257"
    - name: CHATBASE_USER
      value: "chatroach"
    - name: CHATBASE_MAX_CONNECTIONS
      value: "1"
    - name: KAFKA_BROKERS
      value: *kb
    - name: KAFKA_POLL_TIMEOUT
      value: "10s"
    - name: KAFKA_TOPIC
      value: *paymenttopic
    - name: KAFKA_GROUP
      value: "dinersclub"
    - name: DINERSCLUB_BATCH_SIZE
      value: "2"
    # THESE THREE ARE A BUDGET, NOT INDEPENDENT KNOBS. spine hardcodes
    # max.poll.interval.ms=300s; if one batch outruns that, Kafka evicts the
    # group, the uncommitted batch is redelivered, and dinersclub crash-loops
    # on it forever making zero progress. That happened on 2026-08-17 with the
    # old 2m/2m values and no provider timeout at all.
    #
    # Worst case for a batch (POOL_SIZE == BATCH_SIZE, so messages run
    # concurrently and the batch costs about what one message costs):
    #   auth on cache miss     <=  15s  (1 provider call)
    #   Payout backoff         <=  60s elapsed + 45s last attempt
    #   sendResult backoff     <=  60s elapsed + one in-cluster hermes call
    #   -------------------------------------------------------------
    #   ~180s, leaving headroom under the 300s eviction deadline.
    #
    # ONE ATTEMPT IS THREE CALLS, NOT ONE. Reloadly's DoJob makes FindOperator
    # + Topup, and AutoFallback can add a second Topup on a refusal -- so an
    # attempt costs up to 3x PROVIDER_TIMEOUT (45s), which is why the per-call
    # ceiling has to be so much smaller than the budget that contains it.
    #
    # The retry budget now applies to declined payments, not just to system
    # faults: since dinersclub/classify.go, a provider error code classified
    # `transient` is retried inside this budget instead of being handed
    # straight to the respondent as a failure. 60s buys ~2 real attempts.
    #
    # Raising any of these, or BATCH_SIZE above POOL_SIZE, must be re-checked
    # against that 300s ceiling.
    #
    # CORRECTION to the note this replaces, which had it backwards. That note
    # said the v0.0.45 image "reads these" and that "the code shipped and its
    # config did not". The opposite is true: dinersclub-v0.0.45 points at
    # bc0ec780 (2026-08-01), which PREDATES commit 19692c1b (2026-08-17) --
    # the tag was cut before the timeout work existed. So neither half shipped.
    # v0.0.45 has no bounded provider client at all and ignores
    # DINERSCLUB_PROVIDER_TIMEOUT as an unknown variable.
    #
    # That is why the image and these values are ONE deploy, not two. Applying
    # this file to v0.0.45 would set a per-call ceiling nothing reads, and
    # point the new metrics Service at a port that binary does not listen on --
    # which would page DinersClubMetricsMissing for a healthy pod.
    - name: DINERSCLUB_RETRY_BOTSERVER
      value: "60s"
    - name: DINERSCLUB_RETRY_PROVIDER
      value: "60s"
    # Hard ceiling on ONE outbound provider HTTP call. RETRY_PROVIDER cannot do
    # this job: backoff only checks elapsed time between attempts, so a single
    # hung call is unbounded without this.
    - name: DINERSCLUB_PROVIDER_TIMEOUT
      value: "15s"
    - name: DINERSCLUB_POOL_SIZE
      value: "2"
    # dingconnect enabled 2026-09-02. Config-only, no image change: the
    # provider has shipped compiled since v0.0.45 and prod already runs v0.0.48,
    # but getProvider refuses any name absent from this list, so the code was
    # unreachable. Construction is lazy and the credential is a per-user Generic
    # Secret read at payout (secrets.go), so adding the name cannot crash-loop
    # the pod, and no study pays through it until one sets payment.provider.
    #
    # NOTE: DINERSCLUB_PROVIDER_TIMEOUT below does NOT bound this provider --
    # dingconnect.go builds its own 90s context from dingconnect.DefaultTimeout.
    # That is deliberate for transfers (a 15s cut risks money moving after we
    # stop listening), but it means one hung transfer holds a worker for 90s
    # against DINERSCLUB_POOL_SIZE=2.
    - name: DINERSCLUB_PROVIDERS
      value: "fake,reloadly,giftcard,http,dingconnect"
    # Must match dinersclub.metrics.port below -- the Service targets the
    # container port by name, but the process binds whatever this says.
    - name: DINERSCLUB_METRICS_PORT
      value: "9090"

  # Prometheus scrape target. dinersclub is the first application service here
  # that Prometheus scrapes, and these metrics are not optional colour: since
  # dinersclub/classify.go, a transient or precondition payment failure sends
  # no event and so leaves no row for sql_exporter to find. An empty
  # researcher wallet is invisible everywhere else. Turning this off makes the
  # withheld failures unaccountable and blinds the PaymentWalletEmpty alert in
  # devops/alerts/templates/payment-health.yaml.
  metrics:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true

dean:
  image:
    repository: ghcr.io/vlab-research/dean
    tag: *vdean
    pullPolicy: IfNotPresent
  env:
  - name: CHATBASE_DATABASE
    value: "chatroach"
  - name: CHATBASE_USER
    value: "chatroach"
  - name: CHATBASE_PASSWORD
    value: ""
  - name: CHATBASE_HOST
    value: *host
  - name: CHATBASE_PORT
    value: "26257"
  - name: BOTSERVER_URL
    value: "http://gbv-hermes/synthetic"
  # FIELD_NOT_FOUND was temporarily added here on 2026-07-29 and removed on
  # 2026-07-30, once the VIR-18 recovery it was needed for had run (40 of 54
  # stranded participants replayed back into their surveys).
  #
  # Do not re-add it as a standing entry. FIELD_NOT_FOUND is usually a permanent
  # error -- a survey editor deleting a field produces it too -- so as a
  # retryable tag it burns DEAN_RETRY_MAX_ATTEMPTS (60) attempts per state
  # forever with no possibility of success. It was only worth enabling because
  # a deploy had made a whole cohort's errors retroactively transient.
  #
  # If you ever need it again, note the trap that cost us the most time: adding
  # the tag ALONE does nothing. Replybot serves state from a Redis cache and
  # only replays the event log on a cache MISS, and updateState() rewrites the
  # key with a fresh 24h TTL on every processed event. So retrying reads the
  # same corrupt state, re-errors, and keeps the bad entry alive indefinitely --
  # a sweep of 40 participants recovered exactly zero. You must clear the cached
  # state first (devops/clear-state-cache.sh), then let the retry fire.
  - name: DEAN_ERROR_TAGS
    value: "NETWORK,INTERNAL,STATE_ACTIONS"
  - name: DEAN_ERROR_INTERVAL
    value: "48 hours"
  - name: DEAN_FB_CODES
    value: "2022,613,-1,190,80006,551"
  - name: DEAN_BLOCKED_INTERVAL
    value: "120 hours"
  - name: DEAN_RESPONDING_INTERVAL
    value: "48 hours"
  - name: DEAN_RESPONDING_GRACE
    value: "20 minutes"
  - name: DEAN_RETRY_MAX_ATTEMPTS
    value: "60"
  - name: DEAN_PAYMENT_GRACE
    value: "2 hours"
  - name: DEAN_PAYMENT_INTERVAL
    value: "14 days"
  - name: DEAN_PAYMENT_MAX_ATTEMPTS
    value: "30"
  - name: DEAN_TIMEOUT_MAX_ATTEMPTS
    value: "5"
  - name: DEAN_SEND_DELAY
    value: "3s"
  - name: DEAN_FOLLOWUP_MIN
    value: "12 hours"
  - name: DEAN_FOLLOWUP_MAX
    value: "24 hours"
  - name: DEAN_TIMEOUT_BLACKLIST
    value: "bebborsbaseserb,bebbobg2basebul,nciaim2followup2pay,nciaim2followup1pay,nciaim2baselinepay"
  - name: DEAN_TIMEOUT_MAX_PAST
    value: "72 hours"
  - name: DEAN_SPAMMER_EXTERNAL_EVENTS_MAX
    value: "100"
  queries:
    - name: respondings
      queries: "respondings,blocked,errored"
      schedule: "*/30 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: followups
      queries: "followups"
      schedule: "0 5-19 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: timeouts
      queries: "timeouts"
      schedule: "*/10 * * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: payments
      queries: "payments"
      schedule: "0 */6 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
    - name: spammers
      queries: "spammers"
      schedule: "30 3 * * *"
      resources:
        requests:
          cpu: 10m
          memory: 10Mi

