      value: "64"
    - name: RELOADLY_SANDBOX
      value: "false"
    - name: BOTSERVER_URL
      value: "http://gbv-hermes/synthetic"
    - name: CHATBASE_DATABASE
      value: "chatroach"
    - name: CHATBASE_HOST
      value: *host
    - name: CHATBASE_PORT
      value: "26257"
    - name: CHATBASE_USER
