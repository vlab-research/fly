# Ingress for ntfy. TLS via cert-manager (letsencrypt-prod) into ntfy-tls.
# NO oauth2-proxy here — ntfy uses its own token/user auth so the phone app and
# AlertManager (non-browser clients) can authenticate. Streaming annotations keep
# the subscribe connection (SSE / WebSocket) open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: monitoring
  labels: { app.kubernetes.io/name: ntfy }
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Long-lived subscribe streams: don't buffer, don't time out at 60s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ntfy.vlab.digital
      secretName: ntfy-tls
  rules:
    - host: ntfy.vlab.digital
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
