# Off-cluster backup of the MinIO `media` bucket into GCS, by `gcloud storage rsync`.
#
# Operator doc: documentation/backups.md § "Media backup (MinIO -> GCS)".
# Design and restore rehearsal: planning/media-backup.md.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
# ---------------------------------------------------------------------------
# MinIO is distributed across 4 nodes with erasure coding (devops/minio/), which
# covers disk failure and node failure. It does NOT cover loss of the cluster's
# disks — and media is UNRECOVERABLE BY CONSTRUCTION: we hold the only copy of a
# researcher's uploaded bytes. Meta offers no download for an attachment id, so
# there is nothing to re-derive from. Exports can be regenerated; media cannot.
#
# ---------------------------------------------------------------------------
# SOURCE AND TARGET
# ---------------------------------------------------------------------------
# Source: this cluster's MinIO over S3, as the read-only `media-backup` MinIO
# service account. Its key pair is the only secret this job holds, written into
# the gitignored devops/backup/.env-media-mirror by
# `devops/minio/media-svcacct.sh production`.
#
# Target: gs://vlab-research-media-backups, written through GCS's own API under
# Workload Identity. The ServiceAccount below is bound to the media-backup@ GSA
# by infra/modules/media-backup, so no GCS credential exists on disk, in the
# repo, or in Terraform state. The bucket is versioned: an overwrite or delete
# keeps the replaced bytes for 30 days.
#
# Why gcloud and not rclone: media-proxy serves Content-Type and
# Content-Disposition from object metadata, so the backup must carry both.
# `gcloud storage` copies them from S3 into GCS; rclone's GCS backend carries no
# object metadata, so a restore from its copy loses every original filename.
#
# This is backup infrastructure beside the application, like CockroachDB's GCS
# backup. The S3-only rule in planning/media-abstraction.md §4.1 governs how the
# application reaches storage, not this job.
#
#   (cd infra/envs/prod && terraform apply)       # bucket, GSA, IAM, WI binding
#   bash devops/minio/media-svcacct.sh production   # source keys; ALSO rotates the
#                                                   # writer/reader keys -- follow its
#                                                   # printed next steps
#   bash devops/secrets.sh minio minio-media-mirror devops/backup/.env-media-mirror
#   kubectl apply -f devops/backup/minio-media-mirror.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-media-mirror
  namespace: minio
  labels:
    app.kubernetes.io/instance: minio
    app.kubernetes.io/name: minio-media-mirror
  annotations:
    # Must match the WI binding in infra/modules/media-backup (namespace/KSA name).
    iam.gke.io/gcp-service-account: media-backup@toixotoixo.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-media-mirror
  namespace: minio
  labels:
    app.kubernetes.io/instance: minio
    app.kubernetes.io/name: minio-media-mirror
spec:
  # Daily, off-peak. Media is written by researchers at authoring time, not by
  # respondent traffic, so the RPO that matters is "a day's uploads", and a
  # researcher who loses today's upload still has the source file on their
  # laptop — which is exactly not true of anything older.
  schedule: "0 3 * * *"
  # A mirror that overruns its window must not be joined by a second one racing
  # it over the same objects.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # Long enough for a full first copy of a large bucket; short enough that a
      # wedged job is noticed rather than running until the next schedule.
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: minio
            app.kubernetes.io/name: minio-media-mirror
        spec:
          serviceAccountName: minio-media-mirror
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: gcloud
              # Pinned by digest: the one command standing between us and
              # permanent data loss must not change without a diff.
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-slim@sha256:9bf51bc7c410ab15cd5c7412a8b5f120489056679d3c4db7a7f029f72d5a433a
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  src="s3://media"
                  dst="gs://${BACKUP_BUCKET}"

                  # No --delete-unmatched-destination-objects: a deletion on the
                  # source is never propagated. Deleting would make this a
                  # replica, copying an accidental delete onto the only other
                  # copy before anyone noticed.
                  gcloud storage rsync --recursive "$src" "$dst"

                  # Fail the run if any source object is absent from the target,
                  # so a silently partial backup alerts.
                  gcloud storage ls "$src/**" | sed "s#^$src/##" | sort > /tmp/src.txt
                  gcloud storage ls "$dst/**" | sed "s#^$dst/##" | sort > /tmp/dst.txt
                  missing=$(comm -23 /tmp/src.txt /tmp/dst.txt)
                  echo "source objects: $(wc -l < /tmp/src.txt)  target objects: $(wc -l < /tmp/dst.txt)"
                  if [ -n "$missing" ]; then
                      echo "FATAL: objects missing from $dst after rsync:" >&2
                      echo "$missing" >&2
                      exit 1
                  fi
              env:
                - name: BACKUP_BUCKET
                  value: vlab-research-media-backups
                - name: HOME
                  value: /tmp
                - name: CLOUDSDK_CONFIG
                  value: /tmp/gcloud
                - name: CLOUDSDK_CORE_DISABLE_USAGE_REPORTING
                  value: "true"
                - name: CLOUDSDK_STORAGE_S3_ENDPOINT_URL
                  value: http://minio.minio.svc.cluster.local:9000
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-media-mirror
                      key: SOURCE_S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-media-mirror
                      key: SOURCE_S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
