name: replybot-test

# `devops/migrations/**` is a trigger because `replybot/lib/chatbase` is tested
# against a real schema (see the step that starts the database below), so a
# migration can break this suite without touching a file under `replybot/`.
#
# `devops/values/production.yaml` is a trigger for a sharper reason:
# `lib/typewheels/ref-encoding-contract.test.js` reads `versionReplybot` out of
# it and asserts that THAT TAG decodes the refs vlab mints. A deploy bump is
# therefore the single most important moment for this suite to run, and it is
# the one change that touches nothing under `replybot/`. Without this line the
# contract silently stops being checked exactly when the thing it checks moves.
on:
  pull_request:
    paths:
      - 'replybot/**'
      - 'testdata/**'
      - 'devops/migrations/**'
      - 'devops/values/production.yaml'
      - '.github/workflows/replybot-test.yml'
  push:
    branches: [main]
    paths:
      - 'replybot/**'
      - 'testdata/**'
      - 'devops/migrations/**'
      - 'devops/values/production.yaml'
      - '.github/workflows/replybot-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replybot
    steps:
      # fetch-depth: 0 fetches full history AND tags, which
      # `lib/typewheels/ref-encoding-contract.test.js` requires: it extracts the
      # deployed replybot tag's decoder with `git show <tag>:<path>` rather than
      # requiring the checked-out copy, because the whole point is to assert
      # against what RUNS rather than against whatever branch this is. The
      # default depth-1 checkout has no tags and that test cannot run at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: replybot/.nvmrc
      # ONE replybot test file needs a real database: `lib/chatbase/chatbase.test.js`,
      # which came in with the client absorbed from `@vlab-research/chatbase-postgres`.
      # It tests SQL, so it cannot be mocked; every other replybot suite is hermetic.
      #
      # `make -C devops test-db` is the same target developers run locally — it
      # starts CockroachDB on port 5433 and pipes `devops/migrations/*.sql` into
      # it — so CI and a laptop agree on the schema by construction rather than by
      # a second copy of the setup living here.
      #
      # Not a `services:` container: cockroach needs a `start-single-node` command,
      # which GitHub's service blocks cannot supply, and the migrations have to run
      # before mocha starts either way.
      - name: Start test database
        run: make -C ../devops test-db
      - run: npm ci
      - run: npm test
