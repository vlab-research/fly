apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-worker
  labels:
    app: message-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-worker
  template:
    metadata:
      labels:
        app: message-worker
    spec:
      containers:
      - name: message-worker
        image: localhost:5000/message-worker:dev
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
        env:
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: KAFKA_COMMAND_TOPIC
          value: "commands"
        - name: KAFKA_EVENT_TOPIC
          value: "chat-events"
        - name: DATABASE_URL
          value: "postgresql://chatroach@db-cockroachdb-public:26257/chatroach?sslmode=disable"
        - name: BOTSERVER_URL
          value: "http://fly-botserver"
        - name: FACEBOOK_GRAPH_URL
          value: "http://gbv-facebot"
        - name: NUM_WORKERS
          value: "10"
        - name: KAFKA_GROUP_ID
          value: "dev-message-worker"
        # Every retry knob is required; there are no defaults in the code, so a
        # missing one fails at startup rather than silently taking a value
        # nobody chose. See requiredEnv in message-worker/config.go.
        - name: MESSENGER_RETRY_CODES
          value: "1200,551"
        - name: WHATSAPP_RETRY_CODES
          value: "131056"
        - name: MAX_RETRY_ATTEMPTS
          value: "3"
        - name: INITIAL_BACKOFF_MS
          value: "100"
        - name: MAX_BACKOFF_MS
          value: "1000"
        - name: MAX_RETRY_ELAPSED
          # Short in dev: a long ladder just makes local failures slow to see.
          value: "5s"
